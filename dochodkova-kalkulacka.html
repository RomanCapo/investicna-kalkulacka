<style>
  :root {
    --bg: #f5f7f5;
    --surface: #ffffff;
    --chart-surface: #fcfcfb;
    --text-primary: #10231f;
    --text-secondary: #4b5b57;
    --text-muted: #7c8b86;
    --accent: #0f6b5c;
    --accent-soft: #e3f1ec;
    --border: rgba(16,35,31,0.10);
    --border-strong: rgba(16,35,31,0.16);
    --danger: #c23b32;
    --danger-soft: rgba(194,59,50,0.10);

    --slot-principal: #2a78d6;
    --slot-cost: #c23b32;
    --slot-profit: #1baf7a;
    --slot-pillar2: #d08a16;
    --slot-pillar3: #7a5bd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1211;
      --surface: #141c1a;
      --chart-surface: #1a1a19;
      --text-primary: #f5f7f6;
      --text-secondary: #a9b6b2;
      --text-muted: #7f8d89;
      --accent: #35b79f;
      --accent-soft: rgba(53,183,159,0.16);
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.16);
      --danger: #e2635f;
      --danger-soft: rgba(226,99,95,0.14);

      --slot-principal: #3987e5;
      --slot-cost: #e2635f;
      --slot-profit: #199e70;
      --slot-pillar2: #e3a33b;
      --slot-pillar3: #9b82ea;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1211;
    --surface: #141c1a;
    --chart-surface: #1a1a19;
    --text-primary: #f5f7f6;
    --text-secondary: #a9b6b2;
    --text-muted: #7f8d89;
    --accent: #35b79f;
    --accent-soft: rgba(53,183,159,0.16);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.16);
    --danger: #e2635f;
    --danger-soft: rgba(226,99,95,0.14);

    --slot-principal: #3987e5;
    --slot-cost: #e2635f;
    --slot-profit: #199e70;
    --slot-pillar2: #e3a33b;
    --slot-pillar3: #9b82ea;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .font-mono-num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
  }
  input[type="text"]:focus,
  input[type="number"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .legend-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
  .legend-line.dashed { background-image: linear-gradient(to right, currentColor 60%, transparent 0%); background-size: 6px 2px; background-repeat: repeat-x; background-color: transparent !important; }
  .growth-chart-svg { touch-action: pan-y; }
  .btn-accent {
    background: var(--accent);
    color: #ffffff;
    border-radius: 10px;
    padding: 0.55rem 1.1rem;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: opacity .15s ease;
    white-space: nowrap;
  }
  .btn-accent:hover { opacity: 0.9; }
  .btn-accent:disabled { opacity: 0.55; cursor: default; }
  .segmented {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .segmented button {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.8125rem;
    font-weight: 700;
    padding: 0.45rem 0.6rem;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  .gap-hatch {
    background-image: repeating-linear-gradient(45deg, var(--danger) 0 2px, transparent 2px 7px);
    background-color: var(--danger-soft);
  }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(90deg); }
  .chev { transition: transform .15s ease; display: inline-block; }
  .fade-in { animation: calcFadeIn .32s ease; }
  @keyframes calcFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
  }
  ::selection { background: var(--accent-soft); }
</style>

<script>
// Pri vložení cez <iframe> (napr. vo WordPresse) posiela stránka rodičovi svoju
// aktuálnu výšku, aby sa iframe vedel natiahnuť bez vnútorného posúvania.
if (window.parent !== window) {
  let lastHeight = 0;
  const postHeight = () => {
    // Výška obsahu (body), nie documentElement.scrollHeight — ten nikdy neklesne
    // pod výšku iframu, takže by sa iframe po zbalení obsahu už nezmenšil.
    const h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h !== lastHeight) {
      lastHeight = h;
      window.parent.postMessage({ type: "dochodkova-kalkulacka:height", height: h }, "*");
    }
  };
  new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);
}
</script>

const fmtEUR = (n) => new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const fmtPct = (n) => new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 1 }).format(n) + " %";
const fmtCompactEUR = (n) => {
  if (Math.abs(n) >= 1000000) {
    return new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 2 }).format(n / 1000000) + " mil. €";
  }
  if (Math.abs(n) >= 1000) {
    return new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 1 }).format(n / 1000) + " tis. €";
  }
  return fmtEUR(n);
};

function niceScale(maxRaw, stepsCount) {

  const magnitude = Math.pow(10, Math.floor(Math.log10(rough)));

  if (norm <= 1) niceNorm = 1;
  else if (norm <= 2) niceNorm = 2;
  else if (norm <= 2.5) niceNorm = 2.5;
  else if (norm <= 5) niceNorm = 5;
  else niceNorm = 10;
  const step = niceNorm * magnitude;
  return { step, max: step * stepsCount };
}

function pickAgeTicks(startAge, endAge) {
  const span = endAge - startAge;
  const stepY = span <= 12 ? 2 : span <= 30 ? 5 : 10;
  const ticks = [startAge];
  for (let a = Math.ceil((startAge + 1) / stepY) * stepY; a < endAge; a += stepY) {
    if (a - startAge >= stepY / 2 && endAge - a >= stepY / 2) ticks.push(a);
  }
  ticks.push(endAge);
  return ticks;
}

// Graf celého životného cyklu: fáza sporenia (hodnota portfólia rastie, prerušovaná
// čiara = vložené peniaze) a fáza výplaty renty (portfólio sa postupne míňa).
function LifeChart({ calc, showReal, principalColor, valueColor }) {
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);

  const width = 640, height = 300;
  const padL = 80, padR = 12, padT = 22, padB = 28;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  const { points, age: startAge, endAge, retAge } = calc;
  const val = (p) => (showReal ? p.real : p.nom);
  const inv = (p) => (showReal ? p.invReal : p.invNom);

  const divisions = 5;
  let maxRaw = 1;
  for (const p of points) maxRaw = Math.max(maxRaw, val(p), p.phase === "acc" ? inv(p) : 0);
  const { step, max: maxVal } = niceScale(maxRaw * 1.04, divisions);

  const xScale = (a) => padL + clamp01((a - startAge) / (endAge - startAge)) * plotW;
  const yScale = (v) => padT + plotH - clamp01(v / maxVal) * plotH;
  const toPath = (pts) => pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");

  const accPts = points.filter((p) => p.phase === "acc");
  const valuePts = points.map((p) => [xScale(p.age), yScale(val(p))]);
  const investedPts = accPts.map((p) => [xScale(p.age), yScale(inv(p))]);
  const valueLine = toPath(valuePts);
  const investedLine = toPath(investedPts);
  const valueArea = valueLine + ` L ${xScale(endAge).toFixed(2)},${yScale(0).toFixed(2)} L ${xScale(startAge).toFixed(2)},${yScale(0).toFixed(2)} Z`;
  const investedArea = investedPts.length
    ? investedLine + ` L ${investedPts[investedPts.length - 1][0].toFixed(2)},${yScale(0).toFixed(2)} L ${xScale(startAge).toFixed(2)},${yScale(0).toFixed(2)} Z`
    : "";

  const handleMove = (e) => {
    if (!svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const xUser = ((e.clientX - rect.left) / rect.width) * width;
    const a = clamp01((xUser - padL) / plotW) * (endAge - startAge);
    setHoverIdx(Math.min(Math.max(Math.round(a * 12), 0), points.length - 1));
  };

  const hp = hoverIdx != null ? points[hoverIdx] : null;
  const leftPct = hp ? Math.min(90, Math.max(10, (xScale(hp.age) / width) * 100)) : 0;
  const topPct = hp ? (yScale(val(hp)) / height) * 100 : 0;
  const retX = xScale(retAge);

  return (
    <div className="relative w-full">
      <svg
        ref={svgRef}
        className="growth-chart-svg"
        viewBox={`0 0 ${width} ${height}`}
        width={width}
        height={height}
        style={{ width: "100%", height: "auto", display: "block" }}
        onMouseMove={handleMove}
        onMouseLeave={() => setHoverIdx(null)}
        role="img"
        aria-label="Vývoj dôchodkového portfólia počas sporenia a výplaty renty"
      >
        {Array.from({ length: divisions + 1 }, (_, i) => i).map((i) => {
          const yy = yScale(step * i);
          return (
            <g key={i}>
              <line x1={padL} y1={yy} x2={width - padR} y2={yy} stroke="var(--border)" strokeWidth="1" />
              <text x={padL - 10} y={yy + 3} textAnchor="end" className="font-mono-num" style={{ fontSize: 9, fill: "var(--text-muted)" }}>
                {fmtCompactEUR(step * i)}
              </text>
            </g>
          );
        })}
        {pickAgeTicks(startAge, endAge).map((a) => (
          <text key={a} x={xScale(a)} y={height - padB + 16} textAnchor="middle" className="font-mono-num" style={{ fontSize: 9, fill: "var(--text-muted)" }}>
            {a} r.
          </text>
        ))}

        <rect x={retX} y={padT} width={Math.max(0, width - padR - retX)} height={plotH} fill="var(--accent-soft)" opacity="0.55" />
        <line x1={retX} y1={padT - 6} x2={retX} y2={height - padB} stroke="var(--accent)" strokeWidth="1" strokeDasharray="3 3" />
        <text x={retX + 6} y={padT + 4} className="font-mono-num" style={{ fontSize: 9, fill: "var(--accent)", fontWeight: 600 }}>
          DÔCHODOK · {retAge} r.
        </text>

        {investedArea && <path d={investedArea} fill={principalColor} fillOpacity="0.14" stroke="none" />}
        <path d={valueArea} fill={valueColor} fillOpacity="0.18" stroke="none" />
        {investedLine && <path d={investedLine} fill="none" stroke={principalColor} strokeWidth="2" strokeDasharray="5 4" />}
        <path d={valueLine} fill="none" stroke={valueColor} strokeWidth="2.5" />

        {hp && (
          <g>
            <line x1={xScale(hp.age)} y1={padT} x2={xScale(hp.age)} y2={height - padB} stroke="var(--border-strong)" strokeWidth="1" />
            <circle cx={xScale(hp.age)} cy={yScale(val(hp))} r="4" fill={valueColor} stroke="var(--chart-surface)" strokeWidth="1.5" />
            {hp.phase === "acc" && (
              <circle cx={xScale(hp.age)} cy={yScale(inv(hp))} r="4" fill={principalColor} stroke="var(--chart-surface)" strokeWidth="1.5" />
            )}
          </g>
        )}
      </svg>

      {hp && (
        <div
          className="absolute pointer-events-none rounded-lg px-3 py-2 text-xs"
          style={{
            left: `${leftPct}%`,
            top: `${topPct}%`,
            transform: `translate(${leftPct > 50 ? "-105%" : "5%"}, -110%)`,
            width: "13rem",
            background: "var(--surface)",
            border: "1px solid var(--border-strong)",
            boxShadow: "0 8px 20px rgba(0,0,0,0.16)",
          }}
        >
          <div className="font-semibold mb-1.5" style={{ color: "var(--text-primary)" }}>
            Vek {Math.floor(hp.age)} r. · {hp.phase === "acc" ? "sporenie" : "výplata renty"}
          </div>
          <div className="flex items-center gap-2 mb-1">
            <span className="legend-dot" style={{ background: valueColor }}></span>
            <span style={{ color: "var(--text-secondary)" }}>Portfólio</span>
            <span className="font-mono-num font-semibold ml-auto" style={{ color: "var(--text-primary)" }}>{fmtEUR(val(hp))}</span>
          </div>
          {hp.phase === "acc" ? (
            <div className="flex items-center gap-2">
              <span className="legend-dot" style={{ background: principalColor }}></span>
              <span style={{ color: "var(--text-secondary)" }}>Vložené</span>
              <span className="font-mono-num font-semibold ml-auto" style={{ color: "var(--text-primary)" }}>{fmtEUR(inv(hp))}</span>
            </div>
          ) : (
            <div className="mt-1.5 pt-1.5" style={{ borderTop: "1px solid var(--border)", color: "var(--text-secondary)" }}>
              Renta: <span className="font-mono-num font-semibold" style={{ color: "var(--text-primary)" }}>{fmtEUR(showReal ? calc.renta : calc.renta * hp.defl)}</span> / mes.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Field({ label, unit, value, onChange, min, max, step, hint }) {
  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-baseline justify-between gap-2">
        <label className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>{label}</label>
        <span className="text-xs text-right" style={{ color: "var(--text-muted)" }}>{unit}</span>
      </div>
      <input
        type="number"
        className="w-full rounded-lg px-3 py-2 text-base font-semibold"
        value={value}
        min={min}
        max={max}
        step={step}
        onChange={(e) => onChange(e.target.value === "" ? 0 : parseFloat(e.target.value))}
      />
      <input
        type="range"
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => onChange(parseFloat(e.target.value))}
        aria-label={label}
      />
      {hint && <p className="text-xs" style={{ color: "var(--text-muted)" }}>{hint}</p>}
    </div>
  );
}

function Segmented({ options, value, onChange, label }) {
  return (
    <div className="segmented" role="group" aria-label={label}>
      {options.map((o) => (
        <button key={o.value} type="button" aria-pressed={value === o.value} onClick={() => onChange(o.value)}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

function StatChip({ label, value, sub, tone }) {

      <div className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>{label}</div>
      <div className="font-mono-num text-lg font-semibold mt-1" style={{ color }}>{value}</div>
      {sub && <div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{sub}</div>}

function SectionTitle({ children, right }) {
  return (
    <div className="flex items-center justify-between gap-2 pt-5 first:pt-0" style={{ borderTop: "1px solid var(--border)" }}>
      <h3 className="text-xs font-bold uppercase tracking-wide" style={{ color: "var(--accent)" }}>{children}</h3>
      {right}
    </div>
  );
}

// Nominálna ročná sadzba prevedená na mesačnú jednoduchým delením 12
// (trhový štandard), rovnako ako v investičnej kalkulačke.
function monthlyRateFromAnnual(pct) {
  return pct / 100 / 12;
}

// Súčasná hodnota 1 € vyplácaného na konci každého z `n` mesiacov pri sadzbe `r`.
function annuityFactor(r, n) {
  if (n <= 0) return 0;
  if (Math.abs(r) < 1e-12) return n;
  return (1 - Math.pow(1 + r, -n)) / r;
}

// Fáza sporenia — mesačná simulácia: vklad na začiatku mesiaca, potom sa pripíše
// čistý výnos (výnos − náklady). Mesačný vklad sa každý rok navyšuje o dynamizáciu.
// Popri nominálnych hodnotách sa sleduje aj deflátor (kumulovaná inflácia),
// aby sa dali sumy prepočítať do dnešných cien.
function accumulate({ savings, monthly, dyn, rAcc, im, monthsAcc, startAge, withPoints }) {
  let bal = savings, invNom = savings, invReal = savings, defl = 1, lastContribution = monthly;
  const points = withPoints ? [{ age: startAge, phase: "acc", nom: bal, real: bal, invNom, invReal, defl }] : null;
  for (let mm = 1; mm <= monthsAcc; mm++) {
    const c = monthly * Math.pow(1 + dyn, Math.floor((mm - 1) / 12));
    lastContribution = c;
    invNom += c;
    invReal += c / defl;
    bal = (bal + c) * (1 + rAcc);
    defl *= 1 + im;
    if (points) points.push({ age: startAge + mm / 12, phase: "acc", nom: bal, real: bal / defl, invNom, invReal, defl });
  }
  return { balance: bal, invNom, invReal, defl, lastContribution, points };
}

function computeRetirement(v) {
  const age = clampNum(Math.round(v.age), 18, 74);
  const retAge = clampNum(Math.round(v.retAge), age + 1, 80);
  const endAge = clampNum(Math.round(v.endAge), retAge + 1, 105);
  const yearsToRet = retAge - age;
  const payYears = endAge - retAge;
  const monthsAcc = yearsToRet * 12;
  const monthsPay = payYears * 12;
  const retYear = CURRENT_YEAR + yearsToRet;

  // 1. pilier: zjednodušený vzorec Sociálnej poisťovne
  // dôchodok = POMB × ODP × ADH, kde POMB ≈ vlastná mzda / priemerná mzda (max 3).
  const wage = clampNum(v.wage, 0, 100000);
  const avgWage = clampNum(v.avgWage, 1, 100000);
  const adh = clampNum(v.adh, 0, 1000);
  const yearsWorked = clampNum(Math.round(v.yearsWorked), 0, 60);
  const totalYears = yearsWorked + yearsToRet;
  const pomb = Math.min(wage / avgWage, 3);

  // 2. pilier: za roky sporenia sa dôchodok z 1. piliera kráti úmerne podielu
  // odvodov presmerovaných do 2. piliera (z celkových 18 % na starobné poistenie).
  // Krátenie sa modeluje ako zníženie počtu "plne započítaných" rokov.
  const p2Enabled = !!v.p2Enabled;
  const p2PastYears = p2Enabled ? clampNum(Math.round(v.p2Years), 0, yearsWorked) : 0;
  const p2PastRate = clampNum(v.p2PastRate, 0, 9);
  const p2Rate = clampNum(v.p2Rate, 0, 9);
  const p2Return = clampNum(v.p2Return, 0, 20);
  const p2Balance = p2Enabled ? clampNum(v.p2Balance, 0, 10000000) : 0;
  const reducedYears = p2Enabled ? p2PastYears * (p2PastRate / 18) + yearsToRet * (p2Rate / 18) : 0;
  const fullPension = pomb * totalYears * adh;
  const estimatedPension = pomb * Math.max(0, totalYears - reducedYears) * adh;
  const manualMode = v.pensionMode === "manual";
  const statePension = manualMode ? clampNum(v.manualPension, 0, 100000) : estimatedPension;
  const p2Reduction = manualMode ? 0 : fullPension - estimatedPension;
  const target = clampNum(v.target, 0, 100000);

  const inflation = clampNum(v.inflation, 0, 20);
  const im = Math.pow(1 + inflation / 100, 1 / 12) - 1;
  const returnAcc = clampNum(v.returnAcc, 0, 30);
  const costs = clampNum(v.costs, 0, 10);
  const returnPay = clampNum(v.returnPay, 0, 30);
  const rAcc = monthlyRateFromAnnual(returnAcc - costs);
  const rPay = monthlyRateFromAnnual(returnPay);
  // Reálna mesačná sadzba vo fáze výplaty — renta sa každoročne zvyšuje o infláciu,
  // takže jej kúpna sila zostáva počas celého dôchodku rovnaká.
  const rrPay = (1 + rPay) / (1 + im) - 1;
  const dyn = clampNum(v.dynamization, 0, 20) / 100;
  const rawSavings = clampNum(v.savings, 0, 10000000);
  const rawMonthly = clampNum(v.monthly, 0, 100000);
  const investEnabled = !!v.investEnabled;

  const common = { dyn, rAcc, im, monthsAcc, startAge: age };
  const acc = accumulate({ ...common, savings: investEnabled ? rawSavings : 0, monthly: investEnabled ? rawMonthly : 0, withPoints: true });

  const capitalNom = acc.balance;
  const deflRet = acc.defl;
  const capitalReal = capitalNom / deflRet;

  const perpetual = v.payoutMode === "perpetual";
  let renta = 0;
  if (capitalReal > 0) {
    renta = perpetual ? Math.max(0, capitalReal * rrPay) : capitalReal / annuityFactor(rrPay, monthsPay);
  }

  // Fáza výplaty sa počíta v dnešných cenách (reálne) a do nominálu sa prepočíta deflátorom.
  const points = acc.points;
  let realBal = capitalReal, defl = deflRet;
  for (let mm = 1; mm <= monthsPay; mm++) {
    realBal = Math.max(0, realBal * (1 + rrPay) - renta);
    if (realBal < 0.005) realBal = 0;
    defl *= 1 + im;
    points.push({ age: retAge + mm / 12, phase: "pay", nom: realBal * defl, real: realBal, defl });
  }

  // 2. pilier — príspevok je % z hrubej mzdy; predpokladá sa, že mzda rastie
  // s infláciou, takže aj príspevok sa každý rok zvýši o infláciu. Úspory sa
  // pri odchode premenia na mesačný dôchodok do zvoleného veku (vždy s čerpaním istiny).
  let p2CapitalNom = 0, p2CapitalReal = 0, p2Renta = 0, p2Monthly = 0;
  if (p2Enabled) {
    p2Monthly = wage * (p2Rate / 100);
    const p2 = accumulate({ savings: p2Balance, monthly: p2Monthly, dyn: inflation / 100, rAcc: monthlyRateFromAnnual(p2Return), im, monthsAcc });
    p2CapitalNom = p2.balance;
    p2CapitalReal = p2.balance / p2.defl;
    p2Renta = p2CapitalReal > 0 ? p2CapitalReal / annuityFactor(rrPay, monthsPay) : 0;
  }
  // 3. pilier (DDS) — príspevok klienta a zamestnávateľa v € mesačne, voliteľne
  // s ročným navyšovaním. Úspory sa pri odchode tiež premenia na mesačnú rentu
  // do zvoleného veku. Klientove príspevky do 180 € ročne znižujú základ dane (19 %).
  const p3Enabled = !!v.p3Enabled;
  const p3Balance = p3Enabled ? clampNum(v.p3Balance, 0, 10000000) : 0;
  const p3Client = clampNum(v.p3Client, 0, 100000);
  const p3Employer = clampNum(v.p3Employer, 0, 100000);
  const p3Dyn = clampNum(v.p3Dyn, 0, 20);
  const p3Return = clampNum(v.p3Return, 0, 20);
  let p3CapitalNom = 0, p3CapitalReal = 0, p3Renta = 0, p3EmployerTotal = 0, p3ClientTotal = 0;
  if (p3Enabled) {
    const p3 = accumulate({ savings: p3Balance, monthly: p3Client + p3Employer, dyn: p3Dyn / 100, rAcc: monthlyRateFromAnnual(p3Return), im, monthsAcc });
    p3CapitalNom = p3.balance;
    p3CapitalReal = p3.balance / p3.defl;
    p3Renta = p3CapitalReal > 0 ? p3CapitalReal / annuityFactor(rrPay, monthsPay) : 0;
    const contributed = p3.invNom - p3Balance;
    const share = p3Client + p3Employer > 0 ? p3Employer / (p3Client + p3Employer) : 0;
    p3EmployerTotal = contributed * share;
    p3ClientTotal = contributed - p3EmployerTotal;
  }
  const p3TaxSaving = p3Enabled ? Math.min(p3Client * 12, 180) * 0.19 : 0;

  const basePension = statePension + p2Renta + p3Renta;

  const totalIncome = basePension + renta;
  const gap = target - totalIncome;

  // Koľko by bolo treba mesačne investovať (prvý rok, ďalej s dynamizáciou),
  // aby renta pokryla rozdiel medzi cieľom a dôchodkom z 1. a 2. piliera.
  // Hodnota portfólia je lineárna vo vklade, preto stačí jedna "jednotková" simulácia.
  const gapToCover = Math.max(0, target - basePension);
  let requiredMonthly = 0;
  if (gapToCover > 0) {
    const capReqReal = perpetual ? (rrPay > 0 ? gapToCover / rrPay : Infinity) : gapToCover * annuityFactor(rrPay, monthsPay);
    const capReqNom = capReqReal * deflRet;
    const fvExisting = accumulate({ ...common, savings: rawSavings, monthly: 0 }).balance;
    const fvUnit = accumulate({ ...common, savings: 0, monthly: 1 }).balance;
    requiredMonthly = isFinite(capReqNom) && fvUnit > 0 ? Math.max(0, (capReqNom - fvExisting) / fvUnit) : null;
  }

  // Ročný prehľad — koncové stavy každého roka.
  const yearly = [];
  for (let y = 1; y <= yearsToRet + payYears; y++) {
    const p = points[y * 12];
    const prev = points[(y - 1) * 12];
    const isAcc = y <= yearsToRet;
    yearly.push({
      age: age + y,
      year: CURRENT_YEAR + y,
      phase: isAcc ? "acc" : "pay",
      contributed: isAcc ? p.invNom - prev.invNom : 0,
      rentaNom: isAcc ? 0 : renta * prev.defl * 12,
      nom: p.nom,
      real: p.real,
    });
  }

  return {
    age, retAge, endAge, yearsToRet, payYears, retYear,
    wage, avgWage, adh, yearsWorked, totalYears, pomb, estimatedPension, statePension, pensionMode: v.pensionMode,
    p2Enabled, p2Balance, p2Rate, p2Return, p2Monthly, p2CapitalNom, p2CapitalReal, p2Renta, p2Reduction, basePension,
    p3Enabled, p3Balance, p3Client, p3Employer, p3Dyn, p3Return, p3CapitalNom, p3CapitalReal, p3Renta, p3EmployerTotal, p3ClientTotal, p3TaxSaving,
    target, inflation, returnAcc, costs, returnPay, dynamization: dyn * 100,
    investEnabled, savings: rawSavings, monthly: rawMonthly, lastContribution: acc.lastContribution,
    capitalNom, capitalReal, deflRet, invNom: acc.invNom, invReal: acc.invReal, profitNom: capitalNom - acc.invNom,
    perpetual, renta, rentaNom: renta * deflRet, rrPay,
    totalIncome, gap, gapToCover, requiredMonthly,
    boostPct: basePension > 0 ? (renta / basePension) * 100 : null,
    points, yearly,
  };
}

// Vodorovný skladaný pruh: štátny dôchodok + renta z investícií, prípadne
// šrafovaný chýbajúci diel do cieľa. Zvislá značka ukazuje cieľový príjem.
function IncomeBar({ calc, colors, print }) {
  const { statePension, p2Renta, p3Renta, renta, target } = calc;
  const missing = Math.max(0, target - statePension - p2Renta - p3Renta - renta);
  const scale = Math.max(target, statePension + p2Renta + p3Renta + renta, 1) * 1.06;
  const divider = `2px solid ${print ? "#ffffff" : "var(--surface)"}`;
  const w = (v) => `${(v / scale) * 100}%`;
  const targetLeft = (target / scale) * 100;
  return (
    <div>
      <div className="relative" style={{ paddingTop: "18px" }}>
        {target > 0 && (
          <div className="absolute text-[10px] font-mono-num font-semibold" style={{ top: 0, left: `${targetLeft}%`, transform: "translateX(-50%)", color: print ? "#10231f" : "var(--text-primary)", whiteSpace: "nowrap" }}>
            cieľ {fmtEUR(target)}
          </div>
        )}
        <div className="flex w-full overflow-hidden" style={{ height: "28px", borderRadius: "8px", background: print ? "#f0f2f0" : "var(--bg)", border: `1px solid ${print ? "#e4e4e0" : "var(--border)"}` }}>
          <div style={{ width: w(statePension), background: colors.principal, transition: "width .3s ease" }} title={`Štátny dôchodok ${fmtEUR(statePension)}`}></div>
          <div style={{ width: w(p2Renta), background: colors.pillar2, transition: "width .3s ease", borderLeft: p2Renta > 0 ? divider : "none" }} title={`2. pilier ${fmtEUR(p2Renta)}`}></div>
          <div style={{ width: w(p3Renta), background: colors.pillar3, transition: "width .3s ease", borderLeft: p3Renta > 0 ? divider : "none" }} title={`3. pilier ${fmtEUR(p3Renta)}`}></div>
          <div style={{ width: w(renta), background: colors.profit, transition: "width .3s ease", borderLeft: renta > 0 ? divider : "none" }} title={`Renta ${fmtEUR(renta)}`}></div>
          {missing > 0 && (
            print
              ? <div style={{ width: w(missing), background: "rgba(194,59,50,0.18)" }}></div>
              : <div className="gap-hatch" style={{ width: w(missing), transition: "width .3s ease" }} title={`Chýba ${fmtEUR(missing)}`}></div>
          )}
        </div>
        {target > 0 && (
          <div className="absolute" style={{ top: "14px", bottom: "-4px", left: `${targetLeft}%`, width: "2px", marginLeft: "-1px", background: print ? "#10231f" : "var(--text-primary)" }}></div>
        )}
      </div>
      <ul className="flex flex-col gap-2 mt-4">
        {[
          { key: "state", label: "Štátny dôchodok (1. pilier)", value: statePension, color: colors.principal },
          ...(calc.p2Enabled ? [{ key: "p2", label: `Dôchodok z 2. piliera (do ${calc.endAge} r.)`, value: p2Renta, color: colors.pillar2 }] : []),
          ...(calc.p3Enabled ? [{ key: "p3", label: `Renta z 3. piliera (do ${calc.endAge} r.)`, value: p3Renta, color: colors.pillar3 }] : []),
          { key: "renta", label: calc.perpetual ? "Renta z výnosov investícií" : `Renta z investícií (do ${calc.endAge} r.)`, value: renta, color: colors.profit },
        ].map((s) => (
          <li key={s.key} className="flex items-center gap-2 min-w-0">
            <span className="legend-dot" style={{ background: s.color }}></span>
            <span className="text-sm truncate min-w-0 flex-1" style={{ color: print ? "#4b5b57" : "var(--text-secondary)" }}>{s.label}</span>
            <span className="font-mono-num text-sm font-semibold shrink-0" style={{ color: print ? "#10231f" : "var(--text-primary)" }}>{fmtEUR(s.value)}</span>
          </li>
        ))}
        {missing > 0 && (
          <li className="flex items-center gap-2 min-w-0">
            <span className="legend-dot" style={{ background: colors.cost, opacity: 0.6 }}></span>
            <span className="text-sm truncate min-w-0 flex-1" style={{ color: print ? "#4b5b57" : "var(--text-secondary)" }}>Chýba do cieľa</span>
            <span className="font-mono-num text-sm font-semibold shrink-0" style={{ color: print ? "#c23b32" : "var(--danger)" }}>{fmtEUR(missing)}</span>
          </li>
        )}
      </ul>
    </div>
  );
}

function ResultsCard({ calc, colors }) {
  const covered = calc.gap <= 0.5;
  return (
    <section className="card p-6 flex flex-col gap-6">
      <div>
        <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>
          Mesačný príjem na dôchodku
        </h2>
        <div className="font-mono-num text-4xl font-bold mt-1" style={{ color: "var(--text-primary)" }}>
          {fmtEUR(calc.totalIncome)}
        </div>
        <div className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>
          v dnešných cenách, od {calc.retAge}. roku veku (rok {calc.retYear}) · v cenách roku {calc.retYear}:{" "}
          <span className="font-mono-num font-semibold">{fmtEUR(calc.totalIncome * calc.deflRet)}</span>
        </div>
      </div>

      <IncomeBar calc={calc} colors={colors} />

      {calc.target > 0 && (
        <div
          className="rounded-lg px-4 py-3 text-sm"
          style={{
            background: covered ? "var(--accent-soft)" : "var(--danger-soft)",
            color: "var(--text-primary)",
            border: "1px solid var(--border)",
          }}
        >
          {covered ? (
            <>Cieľ je splnený{calc.gap < -0.5 && <> s rezervou <span className="font-mono-num font-semibold">{fmtEUR(-calc.gap)}</span> mesačne</>}.</>
          ) : calc.requiredMonthly == null ? (
            <>Do cieľa chýba <span className="font-mono-num font-semibold">{fmtEUR(calc.gap)}</span> mesačne. Pri nulovom reálnom výnose počas výplaty nie je renta „len z výnosov“ možná.</>
          ) : (
            <>
              Do cieľa chýba <span className="font-mono-num font-semibold">{fmtEUR(calc.gap)}</span> mesačne. Na jeho dosiahnutie treba investovať{" "}
              <span className="font-mono-num font-semibold">{fmtEUR(calc.requiredMonthly)}</span> mesačne
              {calc.dynamization > 0 && <> (s navyšovaním o {fmtPct(calc.dynamization)} ročne)</>}.
            </>
          )}
        </div>
      )}

      <div className="flex flex-wrap gap-3">
        <StatChip
          label="Renta z investícií"
          value={`${fmtEUR(calc.renta)} / mes.`}
          sub={calc.investEnabled ? (calc.perpetual ? "doživotne, istina zostáva" : `${calc.payYears} rokov, do ${calc.endAge} r.`) : "investovanie je vypnuté"}
          tone="accent"
        />
        <StatChip
          label="Navýšenie príjmu"
          value={calc.boostPct != null ? `+${fmtPct(calc.boostPct)}` : "—"}
          sub={(calc.p2Enabled || calc.p3Enabled) ? "oproti dôchodku z pilierov" : "oproti samotnému štátnemu dôchodku"}
          tone="accent"
        />
        <StatChip
          label="Kapitál pri odchode"
          value={fmtEUR(calc.capitalReal)}
          sub={`v dnešných cenách · nominálne ${fmtCompactEUR(calc.capitalNom)}`}
        />
        {calc.p2Enabled && (
          <StatChip
            label="Dôchodok z 2. piliera"
            value={`${fmtEUR(calc.p2Renta)} / mes.`}
            sub={`kapitál ${fmtEUR(calc.p2CapitalReal)} v dnešných cenách`}
          />
        )}
        {calc.p2Enabled && calc.p2Reduction > 0.5 && (
          <StatChip
            label="Čistý prínos 2. piliera"
            value={`${calc.p2Renta - calc.p2Reduction >= 0 ? "+" : "−"}${fmtEUR(Math.abs(calc.p2Renta - calc.p2Reduction))} / mes.`}
            sub={`po krátení 1. piliera o ${fmtEUR(calc.p2Reduction)}`}
            tone={calc.p2Renta - calc.p2Reduction >= 0 ? "accent" : "danger"}
          />
        )}
        {calc.p3Enabled && (
          <StatChip
            label="Renta z 3. piliera"
            value={`${fmtEUR(calc.p3Renta)} / mes.`}
            sub={`kapitál ${fmtEUR(calc.p3CapitalReal)} v dnešných cenách · od zamestnávateľa ${fmtCompactEUR(calc.p3EmployerTotal)}`}
          />
        )}
        <StatChip
          label="Potrebná investícia na cieľ"
          value={calc.requiredMonthly == null ? "—" : `${fmtEUR(calc.requiredMonthly)} / mes.`}
          sub={calc.gapToCover > 0 ? "pri súčasných úsporách" : ((calc.p2Enabled || calc.p3Enabled) ? "piliere pokryjú cieľ" : "štátny dôchodok pokryje cieľ")}
        />
      </div>
    </section>
  );
}

      <div className="flex items-center gap-4 text-xs flex-wrap">

          <span className="legend-line" style={{ background: colors.profit }}></span>
          <span style={{ color: "var(--text-secondary)" }}>Hodnota portfólia</span>

        <span className="flex items-center gap-1.5">
          <span className="legend-line dashed" style={{ color: colors.principal }}></span>
          <span style={{ color: "var(--text-secondary)" }}>Vložená suma</span>

        </p>
      )}
      {calc.investEnabled && calc.capitalNom > 0 && (

      )}

function YearlyTable({ calc }) {
  if (!calc.investEnabled || calc.capitalNom <= 0) return null;
  return (
    <details className="card p-6">
      <summary className="flex items-center gap-2 text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>
        <span className="chev">›</span> Prehľad po rokoch
      </summary>
      <div className="overflow-x-auto mt-4">
        <table className="w-full text-sm font-mono-num" style={{ borderCollapse: "collapse", minWidth: "34rem" }}>
          <thead>
            <tr style={{ color: "var(--text-muted)" }}>
              {["Vek", "Rok", "Vklady za rok", "Renta za rok", "Portfólio (nominálne)", "Portfólio (dnešné ceny)"].map((h) => (
                <th key={h} className="text-right font-semibold text-xs uppercase tracking-wide px-2 py-2" style={{ borderBottom: "1px solid var(--border-strong)" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {calc.yearly.map((r) => (
              <tr key={r.age} style={{ background: r.age === calc.retAge ? "var(--accent-soft)" : undefined }}>
                <td className="text-right px-2 py-1.5" style={{ borderBottom: "1px solid var(--border)" }}>{r.age}</td>
                <td className="text-right px-2 py-1.5" style={{ borderBottom: "1px solid var(--border)", color: "var(--text-muted)" }}>{r.year}</td>
                <td className="text-right px-2 py-1.5" style={{ borderBottom: "1px solid var(--border)" }}>{r.contributed > 0 ? fmtEUR(r.contributed) : "—"}</td>
                <td className="text-right px-2 py-1.5" style={{ borderBottom: "1px solid var(--border)" }}>{r.rentaNom > 0 ? fmtEUR(r.rentaNom) : "—"}</td>
                <td className="text-right px-2 py-1.5" style={{ borderBottom: "1px solid var(--border)" }}>{fmtEUR(r.nom)}</td>
                <td className="text-right px-2 py-1.5" style={{ borderBottom: "1px solid var(--border)", fontWeight: 600 }}>{fmtEUR(r.real)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </details>
  );
}

function PrintDocument({ printRef, clientName, calc }) {
  const dateStr = new Date().toLocaleDateString("sk-SK");
  const box = { border: "1px solid #e4e4e0", borderRadius: "8px", padding: "8px 10px" };
  const params = [
    ["Súčasný vek", `${calc.age} rokov`],
    ["Odchod do dôchodku", `${calc.retAge} rokov (${calc.retYear})`],
    ["Renta do veku", calc.perpetual ? "doživotne z výnosov" : `${calc.endAge} rokov`],
    calc.pensionMode === "manual"
      ? ["Štátny dôchodok", "zadaný ručne"]
      : ["Hrubá mzda / odprac. roky", `${fmtEUR(calc.wage)} / ${calc.totalYears} r.`],
    ["Cieľový príjem", fmtEUR(calc.target) + " / mes."],
    ["Inflácia", fmtPct(calc.inflation)],
  ];
  if (calc.p2Enabled) {
    params.push(
      ["2. pilier — zostatok", fmtEUR(calc.p2Balance)],
      ["2. pilier — príspevok", `${fmtPct(calc.p2Rate)} (${fmtEUR(calc.p2Monthly)} / mes.)`],
      ["2. pilier — výnos p. a.", fmtPct(calc.p2Return)],
    );
  }
  if (calc.p3Enabled) {
    params.push(
      ["3. pilier — zostatok", fmtEUR(calc.p3Balance)],
      ["3. pilier — klient / zamestnávateľ", `${fmtEUR(calc.p3Client)} / ${fmtEUR(calc.p3Employer)} mesačne`],
      ["3. pilier — výnos p. a.", fmtPct(calc.p3Return)],
    );
  }
  if (calc.investEnabled) {
    params.push(
      ["Súčasné úspory", fmtEUR(calc.savings)],
      ["Mesačná investícia", `${fmtEUR(calc.monthly)} (+${fmtPct(calc.dynamization)} ročne)`],
      ["Výnos / náklady p. a.", `${fmtPct(calc.returnAcc)} / ${fmtPct(calc.costs)}`],
      ["Výnos počas výplaty", fmtPct(calc.returnPay)],
    );
  }
  const results = [
    ["Príjem na dôchodku", fmtEUR(calc.totalIncome) + " / mes.", "#10231f"],
    ["Renta z investícií", fmtEUR(calc.renta) + " / mes.", "#0f6b5c"],
    ["Kapitál pri odchode", fmtEUR(calc.capitalReal), "#10231f"],
  ];

  return (
    <div
      ref={printRef}
      id="pdf-export-root"
      style={{
        width: "794px",
        maxWidth: "100%",
        margin: "0 auto",
        background: "#ffffff",
        color: "#10231f",
        padding: "40px",
        fontFamily: '"Manrope", system-ui, -apple-system, sans-serif',
        fontSize: "12px",
        "--bg": "#f5f7f5",
        "--surface": "#ffffff",
        "--chart-surface": "#fcfcfb",
        "--text-primary": "#10231f",
        "--text-secondary": "#4b5b57",
        "--text-muted": "#7c8b86",
        "--accent": "#0f6b5c",
        "--accent-soft": "#e3f1ec",
        "--border": "rgba(16,35,31,0.10)",
        "--border-strong": "rgba(16,35,31,0.16)",
        "--danger": "#c23b32",
        "--danger-soft": "rgba(194,59,50,0.10)",
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "2px solid #0f6b5c", paddingBottom: "16px", marginBottom: "22px" }}>
        <img src={LOGO_DATA_URI} alt="FinCoach" style={{ height: "34px", width: "auto", display: "block" }} />
        <div style={{ textAlign: "right", fontSize: "11px", color: "#7c8b86" }}>
          <div>Prehľad dôchodku a renty</div>
          <div>Vygenerované: {dateStr}</div>
        </div>
      </div>

      {clientName && (
        <div style={{ fontSize: "26px", fontWeight: 800, lineHeight: 1.2, color: "#0f6b5c", marginBottom: "6px" }}>{clientName}</div>
      )}
      <h1 style={{ fontSize: "20px", fontWeight: 800, margin: "0 0 4px", color: "#10231f" }}>Dôchodok a renta z investícií</h1>
      <p style={{ fontSize: "11px", color: "#4b5b57", margin: "0 0 20px", maxWidth: "620px" }}>
        Ilustratívny prepočet štátneho dôchodku a renty z pravidelného investovania. Sumy sú v dnešných cenách. Nie je investičné odporúčanie.
      </p>

      <div className="pdf-avoid-break" style={{ breakInside: "avoid", marginBottom: "18px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "8px", marginBottom: "12px" }}>
          {params.map(([l, v]) => (
            <div key={l} style={box}>
              <div style={{ fontSize: "9px", color: "#7c8b86", textTransform: "uppercase", letterSpacing: "0.03em" }}>{l}</div>
              <div style={{ fontSize: "12px", fontWeight: 700, marginTop: "2px", color: "#10231f" }}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "8px", marginBottom: "16px" }}>
          {results.map(([l, v, c]) => (
            <div key={l} style={{ ...box, padding: "10px 12px" }}>
              <div style={{ fontSize: "9px", color: "#7c8b86", textTransform: "uppercase" }}>{l}</div>
              <div style={{ fontSize: "16px", fontWeight: 800, color: c }}>{v}</div>
            </div>
          ))}
        </div>
        <IncomeBar calc={calc} colors={PRINT_COLORS} print />
        {calc.gap > 0.5 && calc.requiredMonthly != null && (
          <p style={{ marginTop: "12px", fontSize: "12px", color: "#10231f" }}>
            Do cieľa chýba {fmtEUR(calc.gap)} mesačne — na jeho dosiahnutie treba investovať <strong>{fmtEUR(calc.requiredMonthly)} mesačne</strong>.
          </p>
        )}
      </div>

      {calc.investEnabled && calc.capitalNom > 0 && (
        <div className="pdf-avoid-break" style={{ breakInside: "avoid", marginBottom: "20px" }}>
          <h2 style={{ fontSize: "16px", fontWeight: 800, margin: "0 0 10px", color: "#10231f" }}>Vývoj portfólia (v dnešných cenách)</h2>
          <LifeChart calc={calc} showReal principalColor={PRINT_COLORS.principal} valueColor={PRINT_COLORS.profit} />
        </div>
      )}

      <div style={{ marginTop: "8px", paddingTop: "14px", borderTop: "1px solid #e4e4e0", fontSize: "9px", color: "#7c8b86", display: "flex", justifyContent: "space-between", gap: "12px" }}>
        <span>FinCoach · roman.capak@fincoach.sk · +421 910 252 036</span>
        <span>Automaticky vygenerovaný prehľad, slúži len na ilustráciu.</span>
      </div>
    </div>
  );
}

const DEFAULTS = {
  age: 35, retAge: 65, endAge: 85,
  pensionMode: "estimate", wage: 1800, yearsWorked: 12, avgWage: 1600, adh: DEFAULT_ADH, manualPension: 900,
  p2Enabled: true, p2Balance: 12000, p2Rate: 4, p2Return: 5, p2Years: 10, p2PastRate: 5,
  p3Enabled: true, p3Balance: 3000, p3Client: 20, p3Employer: 30, p3Dyn: 0, p3Return: 4.5,
  target: 1400,
  investEnabled: true, savings: 5000, monthly: 150, dynamization: 3, returnAcc: 7, costs: 1.2,
  payoutMode: "annuity", returnPay: 4, inflation: 3,
};

function App() {
  const [v, setV] = useState(DEFAULTS);
  const set = (key) => (val) => setV((prev) => ({ ...prev, [key]: val }));
  const [clientName, setClientName] = useState("");
  const [showReal, setShowReal] = useState(true);
  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const calc = useMemo(() => computeRetirement(v), [v]);

  const cssColor = (varName) => getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#999";
  const colors = { principal: cssColor("--slot-principal"), cost: cssColor("--slot-cost"), profit: cssColor("--slot-profit"), pillar2: cssColor("--slot-pillar2"), pillar3: cssColor("--slot-pillar3") };

  // Rovnaký postup exportu ako v investičnej kalkulačke: dokument sa na chvíľu
  // vykreslí v normálnom toku stránky, html2canvas ho zachytí a stránka sa vráti späť.
  useEffect(() => {
    if (!exporting) return;
    let cancelled = false;
    (async () => {
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (cancelled) return;
      const el = printRef.current;
      if (!window.html2pdf || !el) {
        setExporting(false);
        return;
      }
      try {
        const dateSlug = new Date().toISOString().slice(0, 10);
        const nameSlug = clientName
          .normalize("NFD").replace(/[̀-ͯ]/g, "")
          .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        const filename = `dochodkova-kalkulacka-${nameSlug ? nameSlug + "-" : ""}${dateSlug}.pdf`;
        const blob = await window.html2pdf().set({
          margin: [10, 10, 14, 10],
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"], avoid: [".pdf-avoid-break"] },
        }).from(el).outputPdf("blob");
        if (cancelled) return;

        if (typeof window.claude !== "undefined" && window.claude && window.claude.use) {
          const downloadsApi = await window.claude.use("downloads");
          if (downloadsApi) {
            await downloadsApi.save({ filename, data: blob }).catch(() => {});
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      } finally {
        if (!cancelled) setExporting(false);
      }
    })();
    return () => { cancelled = true; };
  }, [exporting]);

  return (
    <div className="min-h-full px-4 py-10 md:py-16" style={{ background: "var(--bg)" }}>
      {exporting ? (
        <div style={{ maxWidth: "900px", margin: "0 auto" }}>
          <div className="fade-in" style={{ display: "flex", justifyContent: "center", marginBottom: "16px" }}>
            <span className="btn-accent" style={{ cursor: "default" }}>Generujem PDF…</span>
          </div>
          <PrintDocument printRef={printRef} clientName={clientName.trim()} calc={calc} />
        </div>
      ) : (
        <div className="mx-auto w-full flex flex-col gap-8" style={{ maxWidth: "1024px" }}>
          <header className="flex flex-col gap-4">
            <div className="flex flex-col gap-2">
              <span className="text-xs font-bold uppercase tracking-widest" style={{ color: "var(--accent)" }}>Kalkulačka</span>
              <h1 className="text-3xl md:text-4xl font-extrabold" style={{ color: "var(--text-primary)", textWrap: "balance" }}>
                Dôchodok a renta z investícií
              </h1>
              <p className="text-sm md:text-base max-w-2xl" style={{ color: "var(--text-secondary)" }}>
                Odhadnite svoj štátny dôchodok a zistite, o koľko ho zvýši renta z pravidelného investovania. Kalkulačka ukáže, či dosiahnete požadovaný príjem, a ak nie, koľko by ste mali mesačne investovať.
              </p>
            </div>
            <div className="flex flex-wrap items-end justify-between gap-3 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
              <div className="flex flex-col gap-2 w-full max-w-md">
                <label htmlFor="client-name" className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>Meno klienta</label>
                <input
                  id="client-name"
                  type="text"
                  className="w-full rounded-lg px-3 py-2 text-base font-semibold"
                  placeholder="nepovinné, zobrazí sa v PDF"
                  maxLength={80}
                  value={clientName}
                  onChange={(e) => setClientName(e.target.value)}
                />
              </div>
              <button className="btn-accent" onClick={() => setExporting(true)} disabled={exporting}>
                Exportovať do PDF
              </button>
            </div>
          </header>

          <div className="grid md:grid-cols-2 gap-6 items-start">
            <InputsCard v={v} set={set} />
            <div className="md:sticky md:top-4 flex flex-col gap-6 min-w-0">
              <ResultsCard calc={calc} colors={colors} />
            </div>
          </div>

          <ChartSection calc={calc} colors={colors} showReal={showReal} setShowReal={setShowReal} />
          <YearlyTable calc={calc} />

          <footer className="text-xs" style={{ color: "var(--text-muted)" }}>
            Štátny dôchodok sa odhaduje zjednodušeným vzorcom Sociálnej poisťovne: priemerný osobný mzdový bod (vaša hrubá mzda / priemerná mzda v SR, max. 3) × počet odpracovaných rokov (doteraz + do dôchodku) × aktuálna dôchodková hodnota. Pri sporení v 2. pilieri sa dôchodok z 1. piliera za roky sporenia kráti v pomere príspevku do 2. piliera k 18 % odvodu na starobné poistenie (zjednodušenie „spravodlivého krátenia“). Príspevok do 2. piliera je % z hrubej mzdy a rastie s infláciou; úspory z 2. piliera sa pri odchode premenia na mesačný dôchodok do zvoleného veku. 3. pilier (DDS): mesačný príspevok klienta a zamestnávateľa s voliteľným ročným navýšením, výnos po poplatkoch; úspory sa od odchodu do dôchodku vyplácajú ako renta do zvoleného veku. Daňová úľava = 19 % z príspevkov klienta, najviac zo 180 € ročne (nárok závisí od typu zmluvy); nie je pripočítaná k úsporám. Zdanenie výnosov pri výplate 3. piliera sa nezohľadňuje. Nezohľadňuje zmeny mzdy v čase ani legislatívne zmeny. Investovanie: zložené úročenie s mesačným vkladom na začiatku mesiaca, mesačná sadzba = (výnos − náklady) / 12, vklad sa každý rok navyšuje o dynamizáciu. Renta sa vypláca mesačne a každý rok rastie o infláciu, takže jej kúpna sila zostáva rovnaká; pri „Čerpať aj istinu“ sa portfólio minie do zvoleného veku, pri „Len z výnosov“ zostáva jeho reálna hodnota zachovaná. Sumy „v dnešných cenách“ sú očistené o zadanú infláciu. Nezohľadňuje dane ani odvody. Ilustratívny prepočet, nie je investičné odporúčanie.
          </footer>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
