<html lang="sk">

<title>Životná kalkulačka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #f5f7f5;
    --surface: #ffffff;
    --text-primary: #10231f;
    --text-secondary: #4b5b57;
    --text-muted: #7c8b86;
    --accent: #0f6b5c;
    --accent-soft: #e3f1ec;
    --border: rgba(16,35,31,0.10);
    --border-strong: rgba(16,35,31,0.16);
    --danger: #c23b32;
    --danger-soft: rgba(194,59,50,0.10);
    --warn: #b7791f;
    --warn-soft: rgba(208,138,22,0.12);

    --slot-state: #2a78d6;
    --slot-insurance: #1baf7a;
    --slot-missing: #c23b32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1211;
      --surface: #141c1a;
      --text-primary: #f5f7f6;
      --text-secondary: #a9b6b2;
      --text-muted: #7f8d89;
      --accent: #35b79f;
      --accent-soft: rgba(53,183,159,0.16);
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.16);
      --danger: #e2635f;
      --danger-soft: rgba(226,99,95,0.14);
      --warn: #e3a33b;
      --warn-soft: rgba(227,163,59,0.14);

      --slot-state: #3987e5;
      --slot-insurance: #199e70;
      --slot-missing: #e2635f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1211;
    --surface: #141c1a;
    --text-primary: #f5f7f6;
    --text-secondary: #a9b6b2;
    --text-muted: #7f8d89;
    --accent: #35b79f;
    --accent-soft: rgba(53,183,159,0.16);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.16);
    --danger: #e2635f;
    --danger-soft: rgba(226,99,95,0.14);
    --warn: #e3a33b;
    --warn-soft: rgba(227,163,59,0.14);

    --slot-state: #3987e5;
    --slot-insurance: #199e70;
    --slot-missing: #e2635f;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .font-mono-num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  input[type="number"], select {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
  }
  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .btn-accent {
    background: var(--accent);
    color: #ffffff;
    border-radius: 10px;
    padding: 0.55rem 1.1rem;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: opacity .15s ease;
    white-space: nowrap;
  }
  .btn-accent:hover { opacity: 0.9; }
  .btn-accent:disabled { opacity: 0.55; cursor: default; }
  .btn-ghost {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    white-space: nowrap;
  }
  .btn-ghost:hover { filter: brightness(0.97); }
  .info-btn {
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--accent); color: var(--accent);
    font-size: 11px; font-weight: 800; line-height: 1; font-family: Georgia, serif; font-style: italic;
    background: transparent; cursor: pointer; flex: none;
  }
  .info-btn[aria-expanded="true"] { background: var(--accent); color: var(--surface); }
  .segmented {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .segmented button {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.8125rem;
    font-weight: 700;
    padding: 0.45rem 0.6rem;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  .gap-hatch {
    background-image: repeating-linear-gradient(45deg, var(--danger) 0 2px, transparent 2px 7px);
    background-color: var(--danger-soft);
  }
  .rider-row + .rider-row { border-top: 1px solid var(--border); }
  .rider-row.or-joined { border-top: none; }
  .fade-in { animation: calcFadeIn .32s ease; }
  @keyframes calcFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
  }
  ::selection { background: var(--accent-soft); }
</style>

<div id="root"></div>

<script>
// Pri vložení cez <iframe> (napr. vo WordPresse) posiela stránka rodičovi svoju
// aktuálnu výšku, aby sa iframe vedel natiahnuť bez vnútorného posúvania.
if (window.parent !== window) {
  let lastHeight = 0;
  const postHeight = () => {
    const h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h !== lastHeight) {
      lastHeight = h;
      window.parent.postMessage({ type: "zivotna-kalkulacka:height", height: h }, "*");
    }
  };
  new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);
}
</script>

function netFromGross(gross) {
  const g = Math.max(0, gross);
  const levy = g * EMPLOYEE_LEVY;
  const annualBase = (g - levy) * 12;
  const nczd = annualBase <= 92.8 * LIVING_MIN ? 21 * LIVING_MIN : Math.max(0, 44.2 * LIVING_MIN - annualBase / 4);
  const taxable = Math.max(0, annualBase - nczd);
  const bracket = 176.8 * LIVING_MIN;
  const tax = taxable <= bracket ? taxable * 0.19 : bracket * 0.19 + (taxable - bracket) * 0.25;
  return Math.round(g - levy - tax / 12);
}

const ridersFor = (mode) => (mode === "child" ? RIDERS_CHILD : RIDERS_ADULT);
const defaultRiderState = (mode) =>
  Object.fromEntries(ridersFor(mode).map((r) => [r.key, { on: r.on, value: null, current: 0 }]));

// ─── Výpočet ──────────────────────────────────────────────────────────────────
function compute(v) {
  const gross = clampNum(v.gross, 0, 100000);
  const netAuto = netFromGross(gross);
  const net = v.netManual ? clampNum(v.net, 0, 100000) : netAuto;
  const loans = clampNum(v.loans, 0, 10000000);
  const age = clampNum(v.age, 18, 70);
  const retAge = Math.max(age, clampNum(v.retAge, 50, 75));
  const yearsToRet = retAge - age;
  const vvz = Math.max(1, v.vvz);

  // Invalidný dôchodok: priemerný osobný mzdový bod × (odpracované + dopočítané
  // obdobie do dôchodkového veku) × ADH × percento poklesu schopnosti pracovať.
  const pomb = Math.min(3, gross / vvz);
  const insuredYears = clampNum(v.yearsWorked, 0, 55) + yearsToRet;
  const fullPension = pomb * insuredYears * v.adh;
  const invPension = (pct) => fullPension * pct / 100;

  // Nemocenská 55 % z hrubej mzdy (vymeriavací základ zjednodušene obmedzený na 1,5 × VVZ).
  const sickness = 0.55 * Math.min(gross, 1.5 * vvz);
  const widow = 0.6 * fullPension;
  const orphan = 0.4 * fullPension;

  const lossSick = Math.max(0, net - sickness);
  const lossInv = (pct) => Math.max(0, net - invPension(pct));
  const breadwinnerAdd = Math.floor(24 * net);

  const rec = v.mode === "child"
    ? { injury: 60000, ci: 20000, childInv: 30000, hosp: 20, surgery: 3000, daily: 10, death: 3000 }
    : {
        death: 5000 + Math.round(loans) + (v.breadwinner ? breadwinnerAdd : 0),
        invDecr: Math.round(loans),
        inv41: Math.floor(24 * net),
        inv40r: Math.floor(lossInv(40)),
        inv71: Math.floor(24 * net),
        inv70r: Math.floor(lossInv(70)),
        ci: Math.max(15000, Math.round(12 * net / 100) * 100),
        injury: 40000,
        pn: Math.floor(lossSick / 30),
        surgery: 5000,
        hosp: 20,
        daily: 10,
      };

  const riderDefs = ridersFor(v.mode);
  const chosen = {};
  for (const r of riderDefs) {
    const st = v.riders[r.key] || { on: false, value: null, current: 0 };
    chosen[r.key] = { on: st.on, value: st.value == null ? rec[r.key] : st.value, current: st.current || 0 };
  }
  const covered = (key) => (chosen[key] && chosen[key].on ? chosen[key].value : 0);

  // Scenáre: koľko z čistého príjmu pokryje štát a koľko poistenie.
  const invScenario = (pct) => {
    const insurance = (pct >= 40 ? covered("inv40r") : 0) + (pct >= 70 ? covered("inv70r") : 0);
    const lump = pct >= 70 ? covered("inv41") + covered("inv71") : covered("inv41");
    const loss = lossInv(pct);
    return { key: `inv${pct}`, label: `Invalidita ${pct} %`, state: invPension(pct), insurance, lump,
      lumpMonths: loss > 0 ? lump / loss : null, lossTotal: loss * 12 * yearsToRet };
  };
  const scenarios = [
    { key: "pn", label: "Práceneschopnosť", state: sickness, insurance: covered("pn") * 30 },
    invScenario(40),
    invScenario(70),
  ];

  // Úmrtie živiteľa: výpadok príjmu domácnosti mínus pozostalostné dávky.
  const children = clampNum(v.children, 0, 10);
  const familyBenefits = (v.partner ? widow : 0) + orphan * children;
  const familyGap = Math.max(0, net - familyBenefits);
  const supportYears = clampNum(v.supportYears, 0, 40);
  const familyNeed = familyGap * 12 * supportYears + loans + 5000;
  const deathSum = covered("death");
  const deathCoverMonths = familyGap > 0 ? Math.max(0, deathSum - loans - 5000) / familyGap : null;

  const premium = clampNum(v.premium, 0, 100000);

  return {
    ...v, gross, net, netAuto, loans, age, retAge, yearsToRet, pomb, insuredYears,
    fullPension, invPension, sickness, widow, orphan, lossSick, lossInv, breadwinnerAdd,
    rec, chosen, riderDefs, scenarios, children, familyBenefits, familyGap, supportYears,
    familyNeed, deathSum, deathCoverMonths, premium,
    budgetLo: net * 0.05, budgetHi: net * 0.10,
    premiumPct: net > 0 ? (premium / net) * 100 : null,
  };
}

// ─── UI prvky ─────────────────────────────────────────────────────────────────
// Číselné pole: počas písania drží rozpísaný text (dá sa vymazať, písať čiarku),
// mimo fokusu zobrazí sformátované číslo s medzerami tisícov.
const parseNum = (s) => parseFloat(String(s).replace(/[\s  ]/g, "").replace(",", "."));
function NumInput({ value, onChange, className, style, ariaLabel, decimals = 2 }) {
  const [draft, setDraft] = useState(null);
  return (
    <input
      type="text"
      inputMode="decimal"
      className={className}
      style={style}
      aria-label={ariaLabel}
      value={draft != null ? draft : fmtNum(value, decimals)}
      onFocus={(e) => { setDraft(String(Math.round(value * 10000) / 10000).replace(".", ",")); requestAnimationFrame(() => e.target.select()); }}
      onBlur={() => setDraft(null)}
      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
      onChange={(e) => {
        const s = e.target.value.replace(/[^\d\s ,.\-]/g, "");
        setDraft(s);
        const n = parseNum(s);
        onChange(isFinite(n) ? Math.max(0, n) : 0);
      }}
    />
  );
}

function Field({ label, unit, value, onChange, min, max, step, hint, slider = true }) {
  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-baseline justify-between gap-2">
        <label className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>{label}</label>
        <span className="text-xs text-right" style={{ color: "var(--text-muted)" }}>{unit}</span>
      </div>
      <NumInput className="w-full rounded-lg px-3 py-2 text-base font-semibold font-mono-num" value={value} onChange={onChange}
        ariaLabel={label} decimals={step < 1 ? 4 : 0} />
      {slider && (
        <input type="range" min={min} max={max} step={step} value={Math.min(max, value)}
          onChange={(e) => onChange(parseFloat(e.target.value))} aria-label={label} />
      )}
      {hint && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{hint}</div>}
    </div>
  );
}

function Segmented({ options, value, onChange, label }) {
  return (
    <div className="segmented" role="group" aria-label={label}>
      {options.map((o) => (
        <button key={o.value} type="button" aria-pressed={value === o.value} onClick={() => onChange(o.value)}>

}

// Pruh pokrytia čistého príjmu v jednom scenári: štátna dávka + poistenie + chýba.
function CoverageBar({ scenario, net, colors, print }) {
  const { state, insurance } = scenario;
  const stateUsed = Math.min(state, net);
  const insUsed = Math.min(insurance, Math.max(0, net - stateUsed));
  const extra = Math.max(0, state + insurance - net);
  const missing = Math.max(0, net - stateUsed - insUsed);
  const scale = Math.max(net, state + insurance, 1);
  const w = (x) => `${(x / scale) * 100}%`;
  const divider = `2px solid ${print ? "#ffffff" : "var(--surface)"}`;
  const pct = net > 0 ? Math.min(100, ((stateUsed + insUsed) / net) * 100) : 100;
  const muted = print ? "#7c8b86" : "var(--text-muted)";
  const primary = print ? "#10231f" : "var(--text-primary)";
  return (
    <div style={{ breakInside: "avoid" }}>
      <div className="flex items-baseline justify-between gap-2 mb-1.5">
        <span className="text-sm font-semibold" style={{ color: primary }}>{scenario.label}</span>
        <span className="text-xs font-mono-num" style={{ color: pct >= 99.5 ? (print ? "#0f6b5c" : "var(--accent)") : (print ? "#c23b32" : "var(--danger)") }}>
          pokrytie {fmtNum(pct, 0)} %
        </span>
      </div>
      <div className="flex w-full overflow-hidden" style={{ height: "22px", borderRadius: "7px", background: print ? "#f0f2f0" : "var(--bg)", border: `1px solid ${print ? "#e4e4e0" : "var(--border)"}` }}>
        <div style={{ width: w(stateUsed), background: colors.state, transition: "width .3s ease" }} title={`Štát ${fmtEUR(state)}`}></div>
        <div style={{ width: w(insUsed + extra), background: colors.insurance, transition: "width .3s ease", borderLeft: insurance > 0 ? divider : "none" }} title={`Poistenie ${fmtEUR(insurance)}`}></div>
        {missing > 0 && (
          print
            ? <div style={{ width: w(missing), background: "rgba(194,59,50,0.18)" }}></div>
            : <div className="gap-hatch" style={{ width: w(missing), transition: "width .3s ease" }} title={`Chýba ${fmtEUR(missing)}`}></div>
        )}
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-0.5 mt-1.5 text-xs" style={{ color: muted }}>
        <span>štát <span className="font-mono-num font-semibold" style={{ color: primary }}>{fmtEUR(state)}</span></span>
        <span>poistenie <span className="font-mono-num font-semibold" style={{ color: primary }}>{fmtEUR(insurance)}</span></span>
        {missing > 0.5 && <span>chýba <span className="font-mono-num font-semibold" style={{ color: print ? "#c23b32" : "var(--danger)" }}>{fmtEUR(missing)}</span> / mes.</span>}
        {scenario.lump > 0 && (
          <span>+ jednorazovo <span className="font-mono-num font-semibold" style={{ color: primary }}>{fmtEUR(scenario.lump)}</span>
            {scenario.lumpMonths != null && missing > 0.5 && <> (pokryje stratu na {fmtNum(scenario.lumpMonths, 0)} mes.)</>}
          </span>
        )}
      </div>
    </div>
  );
}

          <Field label="Priemerná mzda v SR (VVZ)" unit="EUR / mesiac" value={v.vvz} onChange={set("vvz")} min={800} max={3000} step={1} slider={false}
            hint="Všeobecný vymeriavací základ spred dvoch rokov — používa sa na osobný mzdový bod." />
        </div>
      </details>
    </section>
  );
}

function ResultsCard({ calc, colors, set }) {
  if (calc.mode === "child") {
    const total = calc.riderDefs.filter((r) => calc.chosen[r.key].on && r.unit === "€").reduce((s, r) => s + calc.chosen[r.key].value, 0);
    return (
      <section className="card p-6 flex flex-col gap-5">
        <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Poistenie dieťaťa</h2>
        <div>
          <div className="text-sm" style={{ color: "var(--text-secondary)" }}>Pri vážnom úraze s progresívnym plnením (napr. 500 %) môže plnenie z trvalých následkov dosiahnuť</div>
          <div className="font-mono-num text-4xl font-bold mt-1" style={{ color: "var(--accent)" }}>{fmtEUR((calc.chosen.injury.on ? calc.chosen.injury.value : 0) * 5)}</div>
        </div>
        <div className="flex flex-wrap gap-3">
          <StatChip label="Jednorazové sumy spolu" value={fmtEUR(total)} sub="vybrané pripoistenia" />
          <StatChip label="Rokov do plnoletosti" value={Math.max(0, 18 - calc.childAge)} sub="odporúčaná minimálna doba poistenia" tone="accent" />
        </div>
        <ul className="text-sm flex flex-col gap-2" style={{ color: "var(--text-secondary)" }}>
          <li>• Ošetrovné (OČR) platí Sociálna poisťovňa rodičovi 55 % z jeho príjmu — hospitalizácia a denné odškodné pokryjú rozdiel.</li>
          <li>• Poistenie dieťaťa sa oplatí pripojiť k zmluve rodiča — býva lacnejšie a pri smrti či invalidite rodiča sa často platí za rodiča poisťovňa (oslobodenie od platenia).</li>
        </ul>
      </section>
    );
  }

  return (
    <section className="card p-6 flex flex-col gap-6">
      <div className="flex flex-col gap-3">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Strata príjmov</h2>
          <select className="rounded-lg px-2 py-1 text-sm font-semibold" value={calc.invPct} onChange={(e) => set("invPct")(parseInt(e.target.value, 10))} aria-label="Miera invalidity">
            {[40, 50, 60, 70, 80, 90, 100].map((p) => <option key={p} value={p}>invalidita {p} %</option>)}
          </select>
        </div>
        <div className="flex flex-wrap gap-3">
          <LossCard label={`Strata mesačne pri invalidite ${calc.invPct} %`} value={Math.floor(calc.lossInv(calc.invPct))}
            sub={calc.yearsToRet > 0 ? `do dôchodku spolu ${fmtEUR(calc.lossInv(calc.invPct) * 12 * calc.yearsToRet)}` : null} />
          <LossCard label="Strata mesačne pri práceneschopnosti" value={Math.floor(calc.lossSick)}
            sub={`${fmtEUR(calc.lossSick / 30)} za každý deň PN`} />
        </div>
      </div>

      <div className="flex flex-col gap-3">
        <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Dávky Sociálnej poisťovne</h2>
        <div className="grid grid-cols-2 gap-3">
          <StatChip label="Nemocenská" value={fmtEUR(calc.sickness)} sub="55 % hrubej mzdy" />
          <StatChip label={`Invalidný dôchodok`} value={fmtEUR(Math.floor(calc.invPension(calc.invPct)))} sub={`pri ${calc.invPct} %`} />
          <StatChip label="Sirotský" value={fmtEUR(Math.floor(calc.orphan))} sub="na dieťa" />
          <StatChip label="Vdovský" value={fmtEUR(Math.floor(calc.widow))} sub="60 % dôchodku" />
        </div>
        <div className="text-xs" style={{ color: "var(--text-muted)" }}>
          Osobný mzdový bod <span className="font-mono-num">{fmtNum(calc.pomb, 3)}</span> × <span className="font-mono-num">{calc.insuredYears}</span> rokov × ADH — invalidný dôchodok pri 100 % by bol <span className="font-mono-num">{fmtEUR(calc.fullPension)}</span>.
        </div>
      </div>

      <div className="flex flex-col gap-4">
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Pokrytie čistého príjmu</h2>
          <span className="text-xs font-mono-num" style={{ color: "var(--text-muted)" }}>netto {fmtEUR(calc.net)}</span>
        </div>
        <Legend colors={colors} />
        {calc.scenarios.map((s) => <CoverageBar key={s.key} scenario={s} net={calc.net} colors={colors} />)}
      </div>
    </section>
  );
}

function FamilyCard({ calc }) {
  if (calc.mode !== "adult" || (!calc.partner && calc.children === 0)) return null;
  const coverPct = calc.familyNeed > 0 ? Math.min(100, (calc.deathSum / calc.familyNeed) * 100) : 100;
  return (
    <section className="card p-6 flex flex-col gap-4 fade-in">
      <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Ak by ste tu neboli — potreba rodiny</h2>
      <div className="flex flex-wrap gap-3">
        <StatChip label="Výpadok príjmu rodiny" value={`${fmtEUR(calc.familyGap)} / mes.`}
          sub={`netto ${fmtEUR(calc.net)} − pozostalostné dávky ${fmtEUR(calc.familyBenefits)}`} tone="danger" />
        <StatChip label="Kapitálová potreba" value={fmtEUR(calc.familyNeed)}
          sub={`${calc.supportYears} r. výpadku + úvery + pohreb`} />
        <StatChip label="Poistná suma smrti" value={fmtEUR(calc.deathSum)}
          sub={`pokrýva ${fmtNum(coverPct, 0)} % potreby`} tone={coverPct >= 99.5 ? "accent" : "danger"} />
      </div>
      <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--danger-soft)" }}>
        <div className="h-full rounded-full" style={{ width: `${coverPct}%`, background: coverPct >= 99.5 ? "var(--accent)" : "var(--warn)", transition: "width .3s ease" }}></div>
      </div>
      <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
        {calc.familyGap <= 0.5
          ? "Pozostalostné dávky pokryjú výpadok príjmu — poistenie smrti stačí na úvery a pohreb."
          : calc.deathCoverMonths != null && (
            <>Po splatení úverov a pohrebe vystačí poistné plnenie rodine na{" "}
              <strong className="font-mono-num">{calc.deathCoverMonths >= 12 ? `${fmtNum(calc.deathCoverMonths / 12, 1)} roka` : `${fmtNum(calc.deathCoverMonths, 0)} mes.`}</strong>
              {calc.familyNeed > calc.deathSum && <> — na {calc.supportYears} rokov by bolo treba <strong className="font-mono-num">{fmtEUR(calc.familyNeed)}</strong></>}.
              {" "}Vdovský dôchodok sa po 1 roku vypláca len pri splnení podmienok (výchova dieťaťa, vek 52+, invalidita).
            </>
          )}
      </p>
    </section>
  );
}

function BudgetCard({ calc, set }) {
  if (calc.mode !== "adult") return null;
  const pct = calc.premiumPct;
  const tone = pct == null || calc.premium === 0 ? null : pct < 5 ? "low" : pct <= 10 ? "ok" : "high";
  return (
    <section className="card p-6 flex flex-col gap-4">
      <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Rozpočet na poistenie</h2>
      <div className="text-sm" style={{ color: "var(--text-secondary)" }}>
        Odporúčame vyčleniť <strong>5–10 %</strong> čistého príjmu, teda <span className="font-mono-num font-semibold" style={{ color: "var(--text-primary)" }}>{fmtEUR(calc.budgetLo)} – {fmtEUR(calc.budgetHi)}</span> mesačne.
      </div>
      <Field label="Mesačné poistné z ponuky" unit="EUR / mesiac, nepovinné" value={calc.premium} onChange={set("premium")} min={0} max={300} step={1}
        hint={tone && (
          <span style={{ color: tone === "ok" ? "var(--accent)" : tone === "high" ? "var(--danger)" : "var(--warn)" }}>
            = {fmtNum(pct, 1)} % čistého príjmu —{" "}
            {tone === "ok" ? "v odporúčanom rozmedzí." : tone === "high" ? "nad rozpočtom, zvážte zníženie menej dôležitých pripoistení." : "pod rozpočtom, je priestor na lepšie krytie hlavných rizík."}
          </span>
        )} />
    </section>
  );
}

function RidersCard({ calc, setRider, resetRiders, compare, setCompare }) {
  const [openInfo, setOpenInfo] = useState(null);
  const gapTotal = calc.riderDefs.reduce((s, r) => {
    const c = calc.chosen[r.key];
    return c.on && r.unit === "€" ? s + Math.max(0, c.value - c.current) : s;
  }, 0);
  return (
    <section className="card p-6 flex flex-col gap-2">
      <div className="flex items-center justify-between gap-3 flex-wrap mb-2">
        <div className="flex items-center gap-3 flex-wrap">
          <h2 className="text-lg font-extrabold" style={{ color: "var(--text-primary)" }}>Pripoistenia</h2>
          <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: "var(--accent-soft)", color: "var(--accent)" }}>Minimálne odporúčané sumy!</span>
        </div>
        <div className="flex items-center gap-3 flex-wrap">
          <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer" style={{ color: "var(--text-secondary)" }}>
            <input type="checkbox" checked={compare} onChange={(e) => setCompare(e.target.checked)} />
            Porovnať s aktuálnou zmluvou
          </label>
          <button type="button" className="btn-ghost" onClick={resetRiders}>Obnoviť pôvodné hodnoty</button>
        </div>
      </div>

      {compare && (
        <div className="hidden md:flex text-xs font-semibold uppercase tracking-wide gap-3 pb-1" style={{ color: "var(--text-muted)" }}>
          <span className="flex-1"></span>
          <span className="w-40 text-center">Odporúčané</span>
          <span className="w-40 text-center">Aktuálna zmluva</span>
          <span className="w-24 text-right">Rozdiel</span>
        </div>
      )}

      <div>
        {calc.riderDefs.map((r) => {
          const c = calc.chosen[r.key];
          const rec = calc.rec[r.key];
          const overridden = c.value !== rec;
          const below = c.on && c.value < rec - 0.5;
          const diff = c.value - c.current;
          return (
            <React.Fragment key={r.key}>
              {r.orBefore && (
                <div className="text-xs font-bold -mt-1 pb-1" style={{ color: "var(--accent)" }}>alebo</div>
              )}
              <div className={`rider-row py-3 ${r.orBefore ? "or-joined" : ""}`}>
                <div className="flex flex-wrap md:flex-nowrap items-center gap-3">
                  <label className="flex items-center gap-3 flex-1 min-w-[14rem] cursor-pointer">
                    <input type="checkbox" checked={c.on} onChange={(e) => setRider(r.key, { on: e.target.checked })} />
                    <span className="text-sm font-semibold" style={{ color: c.on ? "var(--text-primary)" : "var(--text-muted)" }}>{r.label}</span>
                    <button type="button" className="info-btn" aria-expanded={openInfo === r.key} aria-label={`Viac o: ${r.label}`}
                      onClick={(e) => { e.preventDefault(); setOpenInfo(openInfo === r.key ? null : r.key); }}>i</button>
                  </label>
                  <div className="w-full md:w-40">
                    <MoneyInput value={c.value} unit={r.unit} dim={!c.on} ariaLabel={r.label}
                      onChange={(val) => setRider(r.key, { value: val })} />
                  </div>
                  {compare && (
                    <>
                      <div className="w-full md:w-40">
                        <MoneyInput value={c.current} unit={r.unit} dim={!c.on} ariaLabel={`${r.label} — aktuálna zmluva`}
                          onChange={(val) => setRider(r.key, { current: val })} />
                      </div>
                      <div className="w-full md:w-24 text-sm font-mono-num font-semibold md:text-right"
                        style={{ color: !c.on ? "var(--text-muted)" : diff > 0.5 ? "var(--danger)" : "var(--accent)" }}>
                        <span className="md:hidden text-xs font-sans font-normal" style={{ color: "var(--text-muted)" }}>Rozdiel: </span>
                        {!c.on ? "—" : diff > 0.5 ? `−${fmtNum(diff, 0)}` : "✓"}
                      </div>
                    </>
                  )}
                </div>
                {(r.key === "death" && calc.mode === "adult") && (
                  <div className="text-xs mt-1.5 ml-[30px]" style={{ color: "var(--text-secondary)" }}>
                    {calc.breadwinner
                      ? <>Vrátane navýšenia pre živiteľa rodiny o {fmtEUR(calc.breadwinnerAdd)}.</>
                      : <>Pre živiteľa rodiny odporúčame navýšiť o {fmtEUR(calc.breadwinnerAdd)}.</>}
                  </div>
                )}
                {overridden && (
                  <div className="text-xs mt-1.5 ml-[30px] flex items-center gap-2 flex-wrap" style={{ color: below ? "var(--warn)" : "var(--text-muted)" }}>
                    {below ? "⚠ Pod odporúčaným minimom" : "Upravené"} — odporúčané <span className="font-mono-num font-semibold">{fmtNum(rec, 0)} {r.unit}</span>
                    <button type="button" className="underline" style={{ color: "var(--accent)" }} onClick={() => setRider(r.key, { value: null })}>použiť</button>
                  </div>
                )}
                {openInfo === r.key && (
                  <p className="text-sm mt-2 ml-[30px] rounded-lg px-3 py-2 fade-in" style={{ background: "var(--bg)", color: "var(--text-secondary)", border: "1px solid var(--border)" }}>{r.info}</p>
                )}
              </div>
            </React.Fragment>
          );
        })}
      </div>

      {compare && (
        <div className="rounded-lg px-4 py-3 text-sm mt-2" style={{ background: gapTotal > 0.5 ? "var(--danger-soft)" : "var(--accent-soft)", border: "1px solid var(--border)" }}>
          {gapTotal > 0.5
            ? <>Aktuálnej zmluve chýba na jednorazových poistných sumách spolu <span className="font-mono-num font-semibold">{fmtEUR(gapTotal)}</span>.</>
            : <>Aktuálna zmluva spĺňa odporúčané poistné sumy.</>}
        </div>
      )}
    </section>
  );
}

        <img src={LOGO_DATA_URI} alt="FinCoach" style={{ height: "34px", width: "auto", display: "block" }} />
        <div style={{ textAlign: "right", fontSize: "11px", color: "#7c8b86" }}>
          <div>Analýza životného poistenia</div>
          <div>Vygenerované: {dateStr}</div>
        </div>
      </div>

      {clientName && <div style={{ fontSize: "26px", fontWeight: 800, lineHeight: 1.2, color: "#0f6b5c", marginBottom: "6px" }}>{clientName}</div>}
      <h1 style={{ fontSize: "20px", fontWeight: 800, margin: "0 0 4px" }}>{adult ? "Odporúčané krytie životného poistenia" : "Odporúčané poistenie dieťaťa"}</h1>
      <p style={{ fontSize: "11px", color: "#4b5b57", margin: "0 0 20px", maxWidth: "620px" }}>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "8px", marginBottom: "16px" }}>

                <div style={{ fontSize: "20px", fontWeight: 800 }}>{fmtEUR(Math.floor(val))} / mes.</div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "8px", marginBottom: "18px" }}>

              <div key={l} style={box}>
                <div style={{ fontSize: "9px", color: "#7c8b86", textTransform: "uppercase" }}>{l}</div>
                <div style={{ fontSize: "14px", fontWeight: 800 }}>{fmtEUR(Math.floor(val))}</div>

              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {adult && (calc.partner || calc.children > 0) && (
        <p style={{ fontSize: "11px", color: "#10231f", margin: "0 0 18px" }}>
          Potreba rodiny pri úmrtí: výpadok príjmu {fmtEUR(calc.familyGap)} mesačne, na {calc.supportYears} rokov spolu s úvermi a pohrebom <strong>{fmtEUR(calc.familyNeed)}</strong>. Poistná suma smrti {fmtEUR(calc.deathSum)}.
        </p>
      )}
      {adult && calc.premium > 0 && (
        <p style={{ fontSize: "11px", color: "#10231f", margin: "0 0 18px" }}>
          Mesačné poistné {fmtEUR(calc.premium)} = {fmtNum(calc.premiumPct, 1)} % čistého príjmu (odporúčané 5–10 %).
        </p>
      )}

      <div style={{ marginTop: "8px", paddingTop: "14px", borderTop: "1px solid #e4e4e0", fontSize: "9px", color: "#7c8b86", display: "flex", justifyContent: "space-between", gap: "12px" }}>
        <span>FinCoach · roman.capak@fincoach.sk · +421 910 252 036</span>
        <span>Automaticky vygenerovaný prehľad, slúži len na ilustráciu.</span>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
const DEFAULTS = {
  mode: "adult",
  gross: 1500, net: 0, netManual: false, loans: 0,
  age: 35, retAge: 64, yearsWorked: 12, invPct: 40,
  breadwinner: false, partner: false, children: 0, supportYears: 15,
  childAge: 5, premium: 0,
  adh: DEFAULT_ADH, vvz: DEFAULT_VVZ,
};

function App() {
  const [v, setV] = useState(DEFAULTS);
  const [riderState, setRiderState] = useState({ adult: defaultRiderState("adult"), child: defaultRiderState("child") });
  const [compare, setCompare] = useState(false);
  const [clientName, setClientName] = useState("");
  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const set = (key) => (val) => setV((prev) => ({ ...prev, [key]: val }));
  const setRider = (key, patch) => setRiderState((prev) => ({
    ...prev, [v.mode]: { ...prev[v.mode], [key]: { ...prev[v.mode][key], ...patch } },
  }));
  const resetRiders = () => setRiderState((prev) => {
    const fresh = defaultRiderState(v.mode);
    // Hodnoty z aktuálnej zmluvy pri obnovení nechávame.
    for (const k of Object.keys(fresh)) fresh[k].current = prev[v.mode][k].current;
    return { ...prev, [v.mode]: fresh };
  });

  const calc = useMemo(() => compute({ ...v, riders: riderState[v.mode], compare }), [v, riderState, compare]);

  const cssColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#999";
  const colors = { state: cssColor("--slot-state"), insurance: cssColor("--slot-insurance"), missing: cssColor("--slot-missing") };

  // Rovnaký postup exportu ako v ostatných kalkulačkách: dokument sa na chvíľu
  // vykreslí v normálnom toku stránky, html2canvas ho zachytí a stránka sa vráti späť.
  useEffect(() => {
    if (!exporting) return;
    let cancelled = false;
    (async () => {
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (cancelled) return;
      const el = printRef.current;
      if (!window.html2pdf || !el) {
        setExporting(false);
        return;
      }
      try {
        const dateSlug = new Date().toISOString().slice(0, 10);
        const nameSlug = clientName
          .normalize("NFD").replace(/[̀-ͯ]/g, "")
          .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        const filename = `zivotna-kalkulacka-${nameSlug ? nameSlug + "-" : ""}${dateSlug}.pdf`;
        const blob = await window.html2pdf().set({
          margin: [10, 10, 14, 10],
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"], avoid: [".pdf-avoid-break"] },
        }).from(el).outputPdf("blob");
        if (cancelled) return;

        if (typeof window.claude !== "undefined" && window.claude && window.claude.use) {
          const downloadsApi = await window.claude.use("downloads");
          if (downloadsApi) {
            await downloadsApi.save({ filename, data: blob }).catch(() => {});
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      } finally {
        if (!cancelled) setExporting(false);
      }
    })();
    return () => { cancelled = true; };
  }, [exporting]);

  return (
    <div className="min-h-full px-4 py-10 md:py-16" style={{ background: "var(--bg)" }}>
      {exporting ? (
        <div style={{ maxWidth: "900px", margin: "0 auto" }}>
          <div className="fade-in" style={{ display: "flex", justifyContent: "center", marginBottom: "16px" }}>
            <span className="btn-accent" style={{ cursor: "default" }}>Generujem PDF…</span>
          </div>
          <PrintDocument printRef={printRef} clientName={clientName.trim()} calc={calc} />
        </div>
      ) : (
        <div className="mx-auto w-full flex flex-col gap-8" style={{ maxWidth: "1024px" }}>
          <header className="flex flex-col gap-4">
            <div className="flex flex-col gap-2">
              <span className="text-xs font-bold uppercase tracking-widest" style={{ color: "var(--accent)" }}>Kalkulačka</span>
              <h1 className="text-3xl md:text-4xl font-extrabold" style={{ color: "var(--text-primary)", textWrap: "balance" }}>
                Životné poistenie
              </h1>
              <p className="text-sm md:text-base max-w-2xl" style={{ color: "var(--text-secondary)" }}>
                Koľko príjmu by ste stratili pri práceneschopnosti či invalidite a čo z toho pokryje Sociálna poisťovňa? Kalkulačka vypočíta minimálne odporúčané poistné sumy a ukáže, ako dobre chráni váš príjem aj rodinu.
              </p>
            </div>
            <div className="flex flex-wrap items-end justify-between gap-3 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
              <div className="flex flex-col gap-2 w-full max-w-md">
                <label htmlFor="client-name" className="text-sm font-semibold">Meno klienta</label>
                <input id="client-name" type="text" className="w-full rounded-lg px-3 py-2 text-base font-semibold"
                  placeholder="nepovinné, zobrazí sa v PDF" maxLength={80}
                  value={clientName} onChange={(e) => setClientName(e.target.value)} />
              </div>
              <button className="btn-accent" onClick={() => setExporting(true)} disabled={exporting}>Exportovať do PDF</button>
            </div>
          </header>

          <div className="grid md:grid-cols-2 gap-6 items-start">
            <InputsCard v={v} set={set} calc={calc} />
            <div className="md:sticky md:top-4 flex flex-col gap-6 min-w-0">
              <ResultsCard calc={calc} colors={colors} set={set} />
            </div>
          </div>

          <RidersCard calc={calc} setRider={setRider} resetRiders={resetRiders} compare={compare} setCompare={setCompare} />

          <FamilyCard calc={calc} />
          <BudgetCard calc={calc} set={set} />

          <footer className="text-xs" style={{ color: "var(--text-muted)" }}>
            Čistý príjem: odvody zamestnanca 14,4 %, nezdaniteľná časť základu dane 21-násobok životného minima (pri vyššom príjme klesá), daň 19 % / 25 %; daňový bonus na deti sa nezohľadňuje. Nemocenská = 55 % hrubej mzdy (od 4. dňa PN; prvých 10 dní platí zamestnávateľ, vymeriavací základ zjednodušene obmedzený na 1,5-násobok priemernej mzdy). Invalidný dôchodok = osobný mzdový bod (hrubá mzda ÷ priemerná mzda, max. 3) × (odpracované roky + roky do dôchodkového veku) × ADH × percento poklesu schopnosti pracovať. Vdovský dôchodok = 60 %, sirotský = 40 % dôchodku, na ktorý by mal nárok zosnulý (invalidný pri 100 %). Odporúčané sumy: smrť = 5 000 € + úvery (+ 24 × netto pre živiteľa rodiny); invalidita s klesajúcou sumou = úvery; jednorazová invalidita = 24 × netto; renta = netto − invalidný dôchodok; závažné ochorenia = aspoň 15 000 € alebo ročný čistý príjem; PN = (netto − nemocenská) ÷ 30 za deň. Pri scenári invalidity 70 % sa počíta renta 40 % aj 70 %, ak sú zvolené obe. Potreba rodiny sa neúročí ani neupravuje o infláciu. Ilustratívny prepočet, nie je ponukou poistenia ani finančným poradenstvom.
          </footer>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
