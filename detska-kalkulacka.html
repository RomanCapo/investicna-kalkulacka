<!DOCTYPE html>
<html lang="sk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sporenie pre deti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bg: #f5f7f5;
    --surface: #ffffff;
    --text-primary: #10231f;
    --text-secondary: #4b5b57;
    --text-muted: #7c8b86;
    --accent: #0f6b5c;
    --accent-soft: #e3f1ec;
    --border: rgba(16,35,31,0.10);
    --border-strong: rgba(16,35,31,0.16);
    --danger: #c23b32;
    --danger-soft: rgba(194,59,50,0.10);
    --warn: #b7791f;
    --warn-soft: rgba(208,138,22,0.12);

    --slot-state: #2a78d6;
    --slot-insurance: #1baf7a;
    --slot-missing: #c23b32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1211;
      --surface: #141c1a;
      --text-primary: #f5f7f6;
      --text-secondary: #a9b6b2;
      --text-muted: #7f8d89;
      --accent: #35b79f;
      --accent-soft: rgba(53,183,159,0.16);
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.16);
      --danger: #e2635f;
      --danger-soft: rgba(226,99,95,0.14);
      --warn: #e3a33b;
      --warn-soft: rgba(227,163,59,0.14);

      --slot-state: #3987e5;
      --slot-insurance: #199e70;
      --slot-missing: #e2635f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1211;
    --surface: #141c1a;
    --text-primary: #f5f7f6;
    --text-secondary: #a9b6b2;
    --text-muted: #7f8d89;
    --accent: #35b79f;
    --accent-soft: rgba(53,183,159,0.16);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.16);
    --danger: #e2635f;
    --danger-soft: rgba(226,99,95,0.14);
    --warn: #e3a33b;
    --warn-soft: rgba(227,163,59,0.14);

    --slot-state: #3987e5;
    --slot-insurance: #199e70;
    --slot-missing: #e2635f;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .font-mono-num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  input[type="number"], select {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
  }
  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .btn-accent {
    background: var(--accent);
    color: #ffffff;
    border-radius: 10px;
    padding: 0.55rem 1.1rem;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: opacity .15s ease;
    white-space: nowrap;
  }
  .btn-accent:hover { opacity: 0.9; }
  .btn-accent:disabled { opacity: 0.55; cursor: default; }
  .btn-ghost {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    white-space: nowrap;
  }
  .btn-ghost:hover { filter: brightness(0.97); }
  .info-btn {
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--accent); color: var(--accent);
    font-size: 11px; font-weight: 800; line-height: 1; font-family: Georgia, serif; font-style: italic;
    background: transparent; cursor: pointer; flex: none;
  }
  .info-btn[aria-expanded="true"] { background: var(--accent); color: var(--surface); }
  .segmented {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .segmented button {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.8125rem;
    font-weight: 700;
    padding: 0.45rem 0.6rem;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  .gap-hatch {
    background-image: repeating-linear-gradient(45deg, var(--danger) 0 2px, transparent 2px 7px);
    background-color: var(--danger-soft);
  }
  .rider-row + .rider-row { border-top: 1px solid var(--border); }
  .rider-row.or-joined { border-top: none; }
  .fade-in { animation: calcFadeIn .32s ease; }
  @keyframes calcFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
  }
  ::selection { background: var(--accent-soft); }
  /* ─── Motivačný úvod pre klienta (rovnaký na obrazovke aj v PDF) — farby a štýl kalkulačiek ─── */
  .mot { --m-ink: #10231f; --m-sec: #4b5b57; --m-muted: #7c8b86; --m-line: #e3e8e5; --m-tint: #f5f7f5;
    --m-accent: #0f6b5c; --m-accent-soft: #e3f1ec; --m-danger: #c23b32; --m-danger-soft: #f8e8e6;
    background: #ffffff; color: var(--m-ink); border: 1px solid var(--m-line); border-radius: 16px; overflow: hidden;
    font-family: "Manrope", system-ui, sans-serif; }
  .mot .num { font-variant-numeric: tabular-nums; }
  .mot-page { position: relative; padding: 30px 36px 30px; }
  .mot-page + .mot-page { border-top: 1px solid var(--m-line); }
  .mot-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--m-accent); margin-bottom: 18px; }
  .mot-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--m-accent); }
  .mot-logo { height: 26px; width: auto; display: block; }
  .mot-title { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; color: var(--m-ink); line-height: 1.15; }
  .mot-quote { font-size: 15px; font-style: italic; font-weight: 600; color: var(--m-sec); margin-top: 6px; line-height: 1.5; }
  .mot-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 20px 0 18px; }
  .mot-chip { background: var(--m-tint); border: 1px solid var(--m-line); border-radius: 12px; padding: 10px 14px; }
  .mot-chip span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--m-muted); }
  .mot-chip strong { display: block; font-size: 19px; font-weight: 800; color: var(--m-ink); margin-top: 2px; }
  .mot-center { text-align: center; }
  .mot-lead { font-size: 16px; font-weight: 700; color: var(--m-ink); line-height: 1.45; }
  .mot-why { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--m-muted); margin: 10px 0 4px; }
  .mot-big { font-size: 24px; font-weight: 800; color: var(--m-ink); line-height: 1.3; }
  .mot-big b { color: var(--m-danger); font-weight: 800; white-space: nowrap; }
  .mot-bars { max-width: 500px; margin: 14px auto 6px; display: grid; gap: 8px; text-align: left; }
  .mot-bar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 76px; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--m-sec); }
  .mot-bar i { display: block; height: 12px; border-radius: 6px; }
  .mot-bar strong { text-align: right; color: var(--m-ink); font-size: 13px; font-weight: 800; }
  .mot-explain { max-width: 640px; margin: 10px auto 0; background: var(--m-tint); border: 1px solid var(--m-line); border-radius: 10px; padding: 8px 12px; font-size: 11.5px; line-height: 1.5; color: var(--m-sec); text-align: left; }
  .mot-explain b { color: var(--m-ink); }
  .mot-pill { display: inline-block; background: var(--m-accent); color: #fff; font-weight: 800; font-size: 20px; padding: 8px 22px; border-radius: 12px; margin: 18px 0 12px; }
  .mot-need { font-size: 15px; font-weight: 700; color: var(--m-ink); line-height: 1.6; max-width: 640px; margin: 0 auto; }
  .mot-need b { display: inline-block; font-size: 19px; font-weight: 800; color: var(--m-accent); background: var(--m-accent-soft); border-radius: 8px; padding: 0 8px; margin: 0 2px; }
  .mot-need .gen { color: var(--m-accent); }
  .mot-small { font-size: 12.5px; font-style: italic; color: var(--m-muted); margin-top: 10px; }
  .mot-strong { font-size: 16px; font-weight: 800; color: var(--m-ink); margin-top: 6px; line-height: 1.4; }
  .mot-duel { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: stretch; margin: 20px auto 16px; max-width: 620px; }
  .mot-card { border: 2px solid var(--m-line); border-radius: 14px; overflow: hidden; background: #fff; text-align: center; display: flex; flex-direction: column; }
  .mot-card .hd { padding: 12px 12px 10px; }
  .mot-card.sock { border-color: var(--m-danger); }
  .mot-card.sock .hd { background: var(--m-danger-soft); }
  .mot-card.ready { border-color: var(--m-accent); }
  .mot-card.ready .hd { background: var(--m-accent-soft); }
  .mot-card h4 { margin: 0; font-size: 20px; font-weight: 800; }
  .mot-card.sock h4 { color: var(--m-danger); }
  .mot-card.ready h4 { color: var(--m-accent); }
  .mot-card .sub { font-size: 12.5px; font-style: italic; color: var(--m-sec); margin-top: 2px; }
  .mot-card .body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: center; }
  .mot-card .amount { font-size: 26px; font-weight: 800; color: var(--m-ink); line-height: 1.1; }
  .mot-card .amount small { display: block; font-size: 11px; font-weight: 700; color: var(--m-muted); margin-top: 3px; }
  .mot-card .total { font-size: 12px; color: var(--m-sec); }
  .mot-card .total b { display: block; font-size: 15px; font-weight: 800; color: var(--m-ink); }
  .mot-card .hint { font-size: 10.5px; color: var(--m-muted); }
  .mot-or { align-self: center; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--m-muted); }
  .mot-win { font-size: 17px; font-weight: 800; color: var(--m-ink); line-height: 1.5; }
  .mot-win u { color: var(--m-accent); text-decoration-thickness: 2px; }
  .mot-win b { color: var(--m-accent); white-space: nowrap; }
  .mot-status { max-width: 640px; margin: 14px auto 0; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; line-height: 1.5; text-align: left; background: var(--m-accent-soft); color: var(--m-ink); border: 1px solid rgba(15,107,92,0.28); }
  .mot-status.warn { background: var(--m-danger-soft); border-color: rgba(194,59,50,0.28); }
  .mot-sub-title { font-size: 15px; font-style: italic; font-weight: 600; color: var(--m-sec); margin-top: 6px; line-height: 1.5; }
  .mot-sub-title .no { color: var(--m-danger); font-weight: 800; }
  .mot-sub-title .yes { color: var(--m-accent); font-weight: 800; }
  .mot-scenes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 18px 0; }
  .mot-scene { position: relative; border-radius: 14px; border: 1px solid var(--m-line); overflow: hidden; aspect-ratio: 16 / 10; }
  .mot-scene img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .mot-tag { position: absolute; top: 10px; left: 10px; background: var(--m-danger); color: #fff; font-weight: 800; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; letter-spacing: .06em; }
  .mot-tag.good { left: auto; right: 10px; background: var(--m-accent); }
  .mot-divider { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0; }
  .mot-divider::before, .mot-divider::after { content: ""; height: 1px; width: 120px; background: var(--m-line); }
  .mot-divider span { width: 6px; height: 6px; border-radius: 50%; background: var(--m-accent); }
  .mot-some { font-size: 20px; font-style: italic; color: var(--m-ink); line-height: 1.5; }
  .mot-some .no { color: var(--m-danger); font-weight: 800; }
  .mot-some .yes { color: var(--m-accent); font-weight: 800; }
  .mot-early { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0 14px; }
  .mot-early > div { background: var(--m-accent-soft); border: 1px solid rgba(15,107,92,0.18); border-radius: 14px; padding: 14px 12px; text-align: center; }
  .mot-early .when { font-size: 18px; font-weight: 800; color: var(--m-accent); }
  .mot-early .must { font-size: 12.5px; font-weight: 600; color: var(--m-sec); margin: 4px 0 10px; }
  .mot-early .val { display: inline-block; background: var(--m-accent); color: #fff; font-weight: 800; font-size: 16px; border-radius: 999px; padding: 5px 14px; }
  .mot-early .val small { font-size: 11px; font-weight: 700; }
  .mot-end { font-size: 17px; font-weight: 800; font-style: italic; color: var(--m-ink); }
  .mot-note { font-size: 10.5px; color: var(--m-muted); margin-top: 14px; text-align: center; line-height: 1.5; }
  @media (max-width: 640px) {
    .mot-page { padding: 22px 16px 22px; }
    .mot-logo { height: 20px; }
    .mot-chips, .mot-early { grid-template-columns: 1fr; }
    .mot-duel { grid-template-columns: 1fr; }
    .mot-scenes { grid-template-columns: 1fr; }
    .mot-bar { grid-template-columns: 96px minmax(0, 1fr) 70px; }
    .mot-big { font-size: 20px; }
  }
  /* V PDF (šírka 714 px) sa úvod zmestí na dve A4 strany. */
  .mot.print { border: none; border-radius: 0; }
  /* Horných pár pixelov strany ostáva biele — html2pdf pri delení strán občas „presiakne“ o 1–2 px. */
  .mot.print .mot-page { padding: 14px 6px 0; }
  .mot.print .mot-page + .mot-page { border-top: none; }
  /* PDF má pevnú šírku A4 — vždy stolové rozloženie, aj keď sa exportuje z mobilu. */
  .mot.print .mot-logo { height: 26px; }
  .mot.print .mot-chips, .mot.print .mot-early { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mot.print .mot-duel { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  .mot.print .mot-scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mot.print .mot-bar { grid-template-columns: 140px minmax(0, 1fr) 76px; }
  .mot.print .mot-big { font-size: 21px; }
  /* Kompaktnejšie medzery, aby každá strana úvodu vyšla presne na jednu A4. */
  .mot.print .mot-top { margin-bottom: 12px; padding-bottom: 8px; }
  .mot.print .mot-title { font-size: 24px; }
  .mot.print .mot-quote { font-size: 13.5px; margin-top: 4px; line-height: 1.4; }
  .mot.print .mot-chips { margin: 12px 0 12px; }
  .mot.print .mot-chip { padding: 7px 12px; }
  .mot.print .mot-chip strong { font-size: 17px; }
  .mot.print .mot-lead { font-size: 14.5px; }
  .mot.print .mot-why { margin: 6px 0 2px; }
  .mot.print .mot-bars { margin: 10px auto 4px; gap: 6px; }
  .mot.print .mot-explain { font-size: 10.5px; padding: 6px 10px; margin-top: 8px; }
  .mot.print .mot-pill { font-size: 17px; padding: 6px 18px; margin: 12px 0 8px; }
  .mot.print .mot-need { font-size: 13.5px; line-height: 1.5; }
  .mot.print .mot-need b { font-size: 17px; }
  .mot.print .mot-small { font-size: 11.5px; margin-top: 6px; }
  .mot.print .mot-strong { font-size: 14.5px; }
  .mot.print .mot-duel { margin: 12px auto 10px; }
  .mot.print .mot-card .hd { padding: 8px 10px 7px; }
  .mot.print .mot-card h4 { font-size: 17px; }
  .mot.print .mot-card .body { padding: 8px 10px 10px; gap: 5px; }
  .mot.print .mot-card .amount { font-size: 22px; }
  .mot.print .mot-win { font-size: 14.5px; line-height: 1.45; }
  .mot.print .mot-status { font-size: 12px; padding: 8px 12px; margin-top: 10px; }
  /* Úvod životného poistenia: kladné číslo (čo zarobíte), zoznam krytí s vysvetlením. */
  .mot-big.good b { color: var(--m-accent); }
  .mot-story { font-size: 15px; line-height: 1.6; color: var(--m-sec); max-width: 640px; margin: 14px auto 0; text-align: center; }
  .mot.print .mot-story { font-size: 13px; line-height: 1.5; margin-top: 8px; }
  .mot-card .total b.danger { color: var(--m-danger); }
  .mot-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 16px 0 10px; text-align: left; }
  .mot-group { border: 1px solid var(--m-line); border-radius: 14px; overflow: hidden; }
  .mot-group .gh { padding: 9px 14px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .mot-group.core .gh { background: var(--m-danger-soft); color: var(--m-danger); }
  .mot-group.extra .gh { background: var(--m-accent-soft); color: var(--m-accent); }
  .mot-item { padding: 9px 14px; border-top: 1px solid var(--m-line); }
  .mot-item .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .mot-item .name { font-size: 13.5px; font-weight: 800; color: var(--m-ink); }
  .mot-item .sum { font-size: 13.5px; font-weight: 800; color: var(--m-accent); white-space: nowrap; }
  .mot-item p { margin: 3px 0 0; font-size: 12px; line-height: 1.45; color: var(--m-sec); }
  @media (max-width: 640px) { .mot-groups { grid-template-columns: 1fr; } }
  .mot.print .mot-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 10px 0 6px; }
  .mot.print .mot-item { padding: 6px 10px; }
  .mot.print .mot-item .name, .mot.print .mot-item .sum { font-size: 12px; }
  .mot.print .mot-item p { font-size: 10.5px; line-height: 1.35; }
</style>

<div id="root"></div>

<script>
// Pri vložení cez <iframe> (napr. vo WordPresse) posiela stránka rodičovi svoju
// aktuálnu výšku, aby sa iframe vedel natiahnuť bez vnútorného posúvania.
if (window.parent !== window) {
  let lastHeight = 0;
  const postHeight = () => {
    const h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h !== lastHeight) {
      lastHeight = h;
      window.parent.postMessage({ type: "detska-kalkulacka:height", height: h }, "*");
    }
  };
  new ResizeObserver(postHeight).observe(document.body);
  setInterval(postHeight, 600); // poistka pre iframe z inej domény
  window.addEventListener("load", postHeight);
}
</script>

// ─── Stratégie a predpoklady ──────────────────────────────────────────────────
// Výnosy sú očakávané ročné zhodnotenie po nákladoch (ako v Exceli: 2 / 4 / 8 %,
// dynamická mierne konzervatívnejšie). Ponožka = odkladanie bez zhodnotenia.
const STRATEGIES = [
  { key: "conservative", label: "Konzervatívna", desc: "prevažne dlhopisy, nízke výkyvy" },
  { key: "balanced", label: "Zmiešaná", desc: "akcie aj dlhopisy" },
  { key: "dynamic", label: "Dynamická", desc: "svetové akcie, pre dlhý horizont" },
];
const PURPOSES = [
  { value: "start", label: "Štart do života" },
  { value: "study", label: "Štúdium" },
  { value: "housing", label: "Prvé bývanie" },
  { value: "car", label: "Prvé auto" },
];
const purposeLabel = (p) => (PURPOSES.find((x) => x.value === p) || PURPOSES[0]).label;

const newKid = (i) => ({ name: "", age: 2, targetAge: 18, principal: 0, monthly: 50, purpose: "start", target: 20000, key: `k${Date.now()}${i}` });

const DEFAULTS = {
  kids: [newKid(0)],
  active: 0,
  strategy: "dynamic",
  returns: { conservative: 2, balanced: 4, dynamic: 7 },
  inflation: 3,
};

// ─── Výpočet ──────────────────────────────────────────────────────────────────
// Mesačné zloženie, vklad na začiatku mesiaca (rovnako ako v ostatných kalkulačkách).
const mRate = (pct) => pct / 100 / 12;
function fv(principal, monthly, pct, months) {
  if (months <= 0) return principal;
  const i = mRate(pct);
  if (i === 0) return principal + monthly * months;
  const g = Math.pow(1 + i, months);
  return principal * g + monthly * (1 + i) * (g - 1) / i;
}
function monthlyFor(target, principal, pct, months) {
  if (months <= 0) return null;
  const i = mRate(pct);
  const g = Math.pow(1 + i, months);
  const rest = target - principal * (i === 0 ? 1 : g);
  if (rest <= 0) return 0;
  return i === 0 ? rest / months : rest * i / ((g - 1) * (1 + i));
}

function computeKid(kid, a) {
  const age = clampNum(Math.round(kid.age), 0, 25);
  const targetAge = Math.max(age + 1, clampNum(Math.round(kid.targetAge), 1, 30));
  const years = targetAge - age;
  const months = years * 12;
  const principal = clampNum(kid.principal, 0, 1e7);
  const monthly = clampNum(kid.monthly, 0, 1e5);
  const invested = principal + monthly * months;
  const defl = Math.pow(1 + clampNum(a.inflation, 0, 20) / 100, years);
  const pctOf = (key) => clampNum(a.returns[key], 0, 20);
  const selPct = pctOf(a.strategy);

  const strategies = STRATEGIES.map((s) => {
    const value = fv(principal, monthly, pctOf(s.key), months);
    return { ...s, pct: pctOf(s.key), value, real: value / defl, need: null };
  });
  const sock = { value: invested, real: invested / defl };
  const sel = strategies.find((s) => s.key === a.strategy) || strategies[2];

  // Cieľ v dnešných cenách → nominálna suma v cieľovom veku.
  const target = clampNum(kid.target, 0, 1e7);
  const targetNom = target * defl;
  strategies.forEach((s) => { s.need = target > 0 ? monthlyFor(targetNom, principal, s.pct, months) : null; });
  const sockNeed = target > 0 ? Math.max(0, (targetNom - principal) / months) : null;

  // Cena čakania: rovnaký mesačný vklad, ale začiatok o 3 / 6 rokov neskôr.
  const delays = [0, 3, 6].filter((d) => d < years).map((d) => ({ d, value: fv(principal, monthly, selPct, (years - d) * 12), invested: principal + monthly * (years - d) * 12 }));
  const perYearDelay = delays.length > 1 ? (delays[0].value - delays[1].value) / delays[1].d : null;

  const yearly = [];
  for (let y = 0; y <= years; y++) {
    yearly.push({ year: y, age: age + y, invested: principal + monthly * y * 12, value: fv(principal, monthly, selPct, y * 12), sock: principal + monthly * y * 12 });
  }

  return {
    name: (kid.name || "").trim(), age, targetAge, years, months, principal, monthly, invested, purpose: kid.purpose,
    target, targetNom, strategies, sock, sockNeed, sel, selPct, delays, perYearDelay, yearly,
    finalValue: sel.value, realValue: sel.real, gain: sel.value - invested,
    progress: target > 0 ? sel.real / target : null,
  };
}

const kidName = (c, fallback = "Vaše dieťa") => c.name || fallback;
const rokov = (n) => (n === 1 ? "rok" : n >= 2 && n <= 4 ? "roky" : "rokov");
const eurR = (n) => (n == null || !isFinite(n) ? "—" : fmtEUR(Math.round(n)));
const fmtPct = (n) => `${fmtNum(n, 1)} %`;

// ─── UI prvky ─────────────────────────────────────────────────────────────────
const parseNum = (s) => parseFloat(String(s).replace(/[\s  ]/g, "").replace(",", "."));
function NumInput({ value, onChange, className, style, ariaLabel, decimals = 2 }) {
  const [draft, setDraft] = useState(null);
  return (
    <input
      type="text"
      inputMode="decimal"
      className={className}
      style={style}
      aria-label={ariaLabel}
      value={draft != null ? draft : fmtNum(value, decimals)}
      onFocus={(e) => { setDraft(String(Math.round(value * 10000) / 10000).replace(".", ",")); requestAnimationFrame(() => e.target.select()); }}
      onBlur={() => setDraft(null)}
      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
      onChange={(e) => {
        const s = e.target.value.replace(/[^\d\s ,.\-]/g, "");
        setDraft(s);
        const n = parseNum(s);
        onChange(isFinite(n) ? Math.max(0, n) : 0);
      }}
    />
  );
}

function Field({ label, unit, value, onChange, min, max, step, hint, slider = true }) {
  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-baseline justify-between gap-2">
        <label className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>{label}</label>
        <span className="text-xs text-right" style={{ color: "var(--text-muted)" }}>{unit}</span>
      </div>
      <NumInput className="w-full rounded-lg px-3 py-2 text-base font-semibold font-mono-num" value={value} onChange={onChange}
        ariaLabel={label} decimals={step < 1 ? 4 : 0} />
      {slider && (
        <input type="range" min={min} max={max} step={step} value={Math.min(max, value)}
          onChange={(e) => onChange(parseFloat(e.target.value))} aria-label={label} />
      )}
      {hint && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{hint}</div>}
    </div>
  );
}

function Segmented({ options, value, onChange, label }) {
  return (
    <div className="segmented" role="group" aria-label={label}>
      {options.map((o) => (
        <button key={o.value} type="button" aria-pressed={value === o.value} onClick={() => onChange(o.value)}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

function SectionTitle({ children, right }) {
  return (
    <div className="flex items-center justify-between gap-2 pt-5" style={{ borderTop: "1px solid var(--border)" }}>
      <h3 className="text-xs font-bold uppercase tracking-wide" style={{ color: "var(--accent)" }}>{children}</h3>
      {right}
    </div>
  );
}

function StatChip({ label, value, sub, tone }) {
  const color = tone === "danger" ? "var(--danger)" : tone === "accent" ? "var(--accent)" : "var(--text-primary)";
  return (
    <div className="flex-1 min-w-[8.5rem] rounded-xl px-4 py-3" style={{ background: "var(--bg)", border: "1px solid var(--border)" }}>
      <div className="text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>{label}</div>
      <div className="font-mono-num text-xl font-semibold mt-1" style={{ color }}>{value}</div>
      {sub && <div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{sub}</div>}
    </div>
  );
}

// Graf: hodnota účtu (zvolená stratégia) vs. vložené peniaze, na osi vek dieťaťa.
function GrowthChart({ c, colors, print }) {
  const W = 640, H = 260, padL = 64, padR = 14, padT = 14, padB = 30;
  const pw = W - padL - padR, ph = H - padT - padB;
  const maxV = Math.max(1, ...c.yearly.map((p) => p.value));
  const mag = Math.pow(10, Math.floor(Math.log10(maxV / 4)));
  const step = [1, 2, 2.5, 5, 10].map((n) => n * mag).find((s) => s * 4 >= maxV) || mag * 10;
  const top = step * Math.ceil(maxV / step);
  const x = (y) => padL + (c.years ? y / c.years : 0) * pw;
  const yv = (v) => padT + ph - (v / top) * ph;
  const line = (key) => c.yearly.map((p, i) => `${i ? "L" : "M"}${x(p.year).toFixed(1)},${yv(p[key]).toFixed(1)}`).join(" ");
  const area = (key) => `${line(key)} L${x(c.years)},${yv(0)} L${x(0)},${yv(0)} Z`;
  const ticks = [];
  for (let v = 0; v <= top + 0.5; v += step) ticks.push(v);
  const every = c.years <= 8 ? 1 : c.years <= 16 ? 2 : 4;
  const ink = print ? "#7c8b86" : "var(--text-muted)";
  const grid = print ? "#e4e4e0" : "var(--border)";
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width={W} height={H} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="Vývoj sporenia pre dieťa">
      {ticks.map((v) => (
        <g key={v}>
          <line x1={padL} x2={W - padR} y1={yv(v)} y2={yv(v)} stroke={grid} />
          <text x={padL - 8} y={yv(v) + 3} textAnchor="end" style={{ fontSize: 10, fill: ink }}>{v >= 1000 ? `${fmtNum(v / 1000, 1)} tis. €` : `${fmtNum(v, 0)} €`}</text>
        </g>
      ))}
      {c.yearly.filter((p) => p.year % every === 0 || p.year === c.years).map((p) => (
        <text key={p.year} x={x(p.year)} y={H - 10} textAnchor="middle" style={{ fontSize: 10, fill: ink }}>{p.age} r.</text>
      ))}
      <path d={area("value")} fill={colors.value} opacity="0.16" />
      <path d={area("invested")} fill={colors.invested} opacity="0.14" />
      <path d={line("invested")} fill="none" stroke={colors.invested} strokeWidth="2" strokeDasharray="5 4" />
      <path d={line("value")} fill="none" stroke={colors.value} strokeWidth="2.5" />
      <circle cx={x(c.years)} cy={yv(c.finalValue)} r="4" fill={colors.value} />
    </svg>
  );
}

// Čísla sú tie isté ako v detaile kalkulačky (zvolené dieťa a stratégia).
function computeKidMotivation(c, strategyLabel, inflation) {
  return {
    name: c.name, age: c.age, targetAge: c.targetAge, years: c.years, monthly: c.monthly, principal: c.principal,
    weekly: c.monthly * 12 / 52, invested: c.invested, sockValue: c.sock.value, value: c.finalValue, realValue: c.realValue,
    diff: c.finalValue - c.sock.value, strategyLabel, pct: c.selPct, inflation,
    delays: c.delays.map((d) => ({ d: d.d, value: d.value })), perYearDelay: c.perYearDelay,
    purpose: purposeLabel(c.purpose), target: c.target,
    need: c.sel.need != null ? Math.ceil(c.sel.need) : null, sockNeed: c.sockNeed != null ? Math.ceil(c.sockNeed) : null, // nahor ako v tabuľke
    strategies: c.strategies.map((s) => ({ label: s.label, pct: s.pct, value: s.value })),
  };
}

        </div>
        {[{ key: "sock", label: "Ponožka", pct: 0, value: c.sock.value, real: c.sock.real, need: c.sockNeed }, ...c.strategies].map((s) => (
          <div key={s.key} className="grid py-2 text-sm" style={{ gridTemplateColumns: "minmax(0,1.4fr) 0.7fr 1fr 1fr", gap: "8px", borderTop: "1px solid var(--border)", fontWeight: s.key === c.sel.key ? 800 : 500, color: s.key === "sock" ? "var(--danger)" : s.key === c.sel.key ? "var(--accent)" : "var(--text-primary)" }}>
            <span className="truncate">{s.label}</span>
            <span className="text-right font-mono-num">{fmtPct(s.pct)}</span>
            <span className="text-right font-mono-num">{fmtEUR(Math.round(s.value))}</span>
            <span className="text-right font-mono-num">{c.target > 0 ? (s.need != null ? fmtEUR(Math.ceil(s.need)) : "—") : fmtEUR(Math.round(s.real))}</span>
          </div>
        ))}
      </div>
    </section>
  );
}

function ChartCard({ c, colors }) {
  return (
    <section className="card p-6 flex flex-col gap-4">
      <div className="flex flex-wrap items-baseline justify-between gap-2">
        <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Ako porastie účet</h2>
        <div className="flex items-center gap-4 text-xs" style={{ color: "var(--text-secondary)" }}>
          <span className="flex items-center gap-1.5"><span style={{ width: 14, height: 3, background: colors.value, display: "inline-block" }} />Hodnota účtu</span>
          <span className="flex items-center gap-1.5"><span style={{ width: 14, height: 3, background: colors.invested, display: "inline-block" }} />Vložené</span>
        </div>
      </div>
      <GrowthChart c={c} colors={colors} />
    </section>
  );
}

function DelayCard({ c }) {
  if (c.delays.length < 2) return null;
  const max = Math.max(...c.delays.map((d) => d.value), 1);
  return (
    <section className="card p-6 flex flex-col gap-4">
      <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Cena čakania</h2>
      <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
        Rovnaký vklad {fmtEUR(c.monthly)} mesačne, ale so začiatkom neskôr. Každý rok odkladu stojí približne <strong className="font-mono-num" style={{ color: "var(--danger)" }}>{fmtEUR(Math.round(c.perYearDelay))}</strong>.
      </p>
      <div className="flex flex-col gap-3">
        {c.delays.map((d, i) => (
          <div key={d.d} className="grid items-center gap-3 text-sm" style={{ gridTemplateColumns: "8.5rem minmax(0,1fr) 6.5rem" }}>
            <span className="font-semibold">{d.d === 0 ? "Začať dnes" : `O ${d.d} ${rokov(d.d)} neskôr`}</span>
            <span className="h-3 rounded-full" style={{ width: `${Math.max(3, (d.value / max) * 100)}%`, background: i === 0 ? "var(--accent)" : "var(--danger)" }} />
            <span className="text-right font-mono-num font-semibold">{fmtEUR(Math.round(d.value))}</span>
          </div>
        ))}
      </div>
    </section>
  );
}

// ─── PDF ──────────────────────────────────────────────────────────────────────
function PrintKid({ c }) {
  const box = { border: "1px solid #e4e4e0", borderRadius: "8px", padding: "8px 10px" };
  const params = [
    ["Dieťa", `${kidName(c)}, ${c.age} ${rokov(c.age)}`],
    ["Sporenie do veku", `${c.targetAge} rokov (${c.years} ${rokov(c.years)})`],
    ["Vklady", `${fmtEUR(c.monthly)} / mes.${c.principal ? ` + ${fmtEUR(c.principal)}` : ""}`],
    ["Stratégia", `${c.sel.label}, ${fmtPct(c.selPct)} ročne`],
    ["Cieľ", c.target > 0 ? `${purposeLabel(c.purpose)}, ${fmtEUR(c.target)}` : "bez cieľovej sumy"],
    ["Vložené spolu", fmtEUR(Math.round(c.invested))],
  ];
  const th = { textAlign: "left", fontSize: "9px", color: "#7c8b86", textTransform: "uppercase", padding: "6px 8px", borderBottom: "1px solid #e4e4e0" };
  const td = { padding: "6px 8px", borderBottom: "1px solid #eeeeea", fontSize: "12px" };
  return (
    <div className="pdf-avoid-break" style={{ breakInside: "avoid", marginBottom: "22px" }}>
      <h2 style={{ fontSize: "16px", fontWeight: 800, margin: "0 0 10px" }}>{kidName(c, "Dieťa")}</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "8px", marginBottom: "12px" }}>
        {params.map(([l, val]) => (
          <div key={l} style={box}>
            <div style={{ fontSize: "9px", color: "#7c8b86", textTransform: "uppercase", letterSpacing: "0.03em" }}>{l}</div>
            <div style={{ fontSize: "12px", fontWeight: 700, marginTop: "2px" }}>{val}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "8px", marginBottom: "12px" }}>
        {[["Hodnota v " + c.targetAge + " rokoch", fmtEUR(Math.round(c.finalValue))], ["V dnešných peniazoch", fmtEUR(Math.round(c.realValue))], ["Výnos", fmtEUR(Math.round(c.gain))]].map(([l, val]) => (
          <div key={l} style={{ ...box, borderColor: "#0f6b5c" }}>
            <div style={{ fontSize: "9px", color: "#0f6b5c", textTransform: "uppercase", fontWeight: 700 }}>{l}</div>
            <div style={{ fontSize: "16px", fontWeight: 800 }}>{val}</div>
          </div>
        ))}
      </div>
      <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: "12px" }}>
        <thead><tr><th style={th}>Stratégia</th><th style={{ ...th, textAlign: "right" }}>Výnos</th><th style={{ ...th, textAlign: "right" }}>Hodnota</th><th style={{ ...th, textAlign: "right" }}>{c.target > 0 ? "Na cieľ / mes." : "Dnešné €"}</th></tr></thead>
        <tbody>
          {[{ key: "sock", label: "Ponožka", pct: 0, value: c.sock.value, real: c.sock.real, need: c.sockNeed }, ...c.strategies].map((s) => (
            <tr key={s.key} style={{ fontWeight: s.key === c.sel.key ? 800 : 500 }}>
              <td style={td}>{s.label}</td>
              <td style={{ ...td, textAlign: "right" }}>{fmtPct(s.pct)}</td>
              <td style={{ ...td, textAlign: "right" }}>{fmtEUR(Math.round(s.value))}</td>
              <td style={{ ...td, textAlign: "right" }}>{c.target > 0 ? (s.need != null ? fmtEUR(Math.ceil(s.need)) : "—") : fmtEUR(Math.round(s.real))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <GrowthChart c={c} colors={PRINT_COLORS} print />
    </div>
  );
}

        "--bg": "#f5f7f5", "--surface": "#ffffff", "--text-primary": "#10231f", "--text-secondary": "#4b5b57",

        <img src={LOGO_DATA_URI} alt="FinCoach" style={{ height: "34px", width: "auto", display: "block" }} />

        <span>FinCoach · roman.capak@fincoach.sk · +421 910 252 036</span>

// ─── Prepojenie s finančným plánom (plan.html) — aktívne len pri ?plan=1 ──────
// Deti (meno a vek) sa berú z profilu; vklady a ciele sa pamätajú pre každé dieťa podľa poradia.
const PLAN = window.PlanStore && window.PlanStore.isPlanMode() ? window.PlanStore : null;
if (PLAN) PLAN.mountBar("Sporenie pre deti", "children");

function initialState() {
  if (!PLAN) return DEFAULTS;
  const init = PLAN.initialInputs("children", DEFAULTS);
  const profileKids = init.profileKids || [];
  const saved = Array.isArray(init.kids) ? init.kids : [];
  const kids = profileKids.length
    ? profileKids.map((pk, i) => ({ ...newKid(i), ...(saved[i] || {}), name: pk.firstName || "", ...(pk.age != null ? { age: pk.age } : {}) }))
    : saved.length ? saved : DEFAULTS.kids;
  const { profileKids: _drop, ...rest } = init;
  return { ...rest, kids, active: Math.min(rest.active || 0, kids.length - 1) };
}

function summarizeChildren(calcs, v, motivation) {
  const label = (STRATEGIES.find((s) => s.key === v.strategy) || STRATEGIES[2]).label;
  return {
    strategy: v.strategy, strategyLabel: label, inflation: v.inflation, returns: v.returns,
    kids: calcs.map((c) => ({
      name: c.name, age: c.age, targetAge: c.targetAge, years: c.years, purpose: purposeLabel(c.purpose),
      principal: c.principal, monthly: c.monthly, invested: Math.round(c.invested), target: c.target,
      finalValue: Math.round(c.finalValue), realValue: Math.round(c.realValue), sockValue: Math.round(c.sock.value),
      returnPct: c.selPct, requiredMonthly: c.target > 0 && c.sel.need != null ? Math.ceil(c.sel.need) : null,
      yearly: c.yearly.map((p) => ({ year: p.year, age: p.age, invested: Math.round(p.invested), value: Math.round(p.value) })),
    })),
    motivation, // úvod pre klienta — ide aj do PDF plánu (kapitola Sporenie pre deti)
  };
}

function App() {
  const [v, setV] = useState(initialState);
  const set = (key) => (val) => setV((prev) => ({ ...prev, [key]: val }));
  const active = Math.min(v.active || 0, v.kids.length - 1);
  const setKid = (patch) => setV((prev) => ({ ...prev, kids: prev.kids.map((k, i) => (i === active ? { ...k, ...patch } : k)) }));
  // Nové dieťa hneď pomenovať: fokus do prvého viditeľného poľa na meno.
  const addKid = () => {
    setV((prev) => ({ ...prev, kids: [...prev.kids, newKid(prev.kids.length)], active: prev.kids.length }));
    setTimeout(() => { const el = document.querySelector("[data-kid-name]"); if (el) { el.focus(); el.scrollIntoView({ block: "center", behavior: "smooth" }); } }, 50);
  };
  const removeKid = (i) => setV((prev) => {
    const kids = prev.kids.filter((_, j) => j !== i);
    return { ...prev, kids, active: Math.max(0, Math.min(prev.active, kids.length - 1)) };
  });
  const [clientName, setClientName] = useState(() => (PLAN ? PLAN.clientName(PLAN.load()) : ""));
  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const calcs = useMemo(() => v.kids.map((k) => computeKid(k, v)), [v]);
  const c = calcs[active];
  const strategyLabel = (STRATEGIES.find((s) => s.key === v.strategy) || STRATEGIES[2]).label;
  const motivation = useMemo(() => computeKidMotivation(c, strategyLabel, v.inflation), [c, strategyLabel, v.inflation]);

  const readPref = (key, dflt) => { try { const x = localStorage.getItem(key); return x == null ? dflt : x === "1"; } catch (e) { return dflt; } };
  const [showIntro, setShowIntroState] = useState(() => readPref("detska:intro", true));
  const [introInPdf, setIntroInPdfState] = useState(() => readPref("detska:intro-pdf", true));
  const setShowIntro = (on) => { setShowIntroState(on); try { localStorage.setItem("detska:intro", on ? "1" : "0"); } catch (e) {} };
  const setIntroInPdf = (on) => { setIntroInPdfState(on); try { localStorage.setItem("detska:intro-pdf", on ? "1" : "0"); } catch (e) {} };

  useEffect(() => {
    if (!PLAN) return;
    const t = setTimeout(() => PLAN.saveModule("children", v, summarizeChildren(calcs, v, computeKidMotivation(calcs[0], strategyLabel, v.inflation))), 300);
    return () => clearTimeout(t);
  }, [v, calcs]);

  const cssColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#999";
  const colors = { invested: cssColor("--slot-state"), value: cssColor("--slot-insurance") };

  // Rovnaký postup exportu ako v ostatných kalkulačkách.
  useEffect(() => {
    if (!exporting) return;
    let cancelled = false;
    const scrollBack = window.scrollY;
    (async () => {
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (cancelled) return;
      const el = printRef.current;
      if (!window.html2pdf || !el) { setExporting(false); return; }
      try {
        const dateSlug = new Date().toISOString().slice(0, 10);
        const nameSlug = clientName.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        const filename = `sporenie-pre-deti-${nameSlug ? nameSlug + "-" : ""}${dateSlug}.pdf`;
        window.scrollTo(0, 0);
        const blob = await window.html2pdf().set({
          margin: [10, 10, 14, 10],
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true, scrollX: 0, scrollY: 0 },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"], avoid: [".pdf-avoid-break"] },
        }).from(el).outputPdf("blob");
        if (cancelled) return;
        if (typeof window.claude !== "undefined" && window.claude && window.claude.use) {
          const downloadsApi = await window.claude.use("downloads");
          if (downloadsApi) await downloadsApi.save({ filename, data: blob }).catch(() => {});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      } finally {
        if (!cancelled) { setExporting(false); requestAnimationFrame(() => window.scrollTo(0, scrollBack)); }
      }
    })();
    return () => { cancelled = true; };
  }, [exporting]);

  const tabs = <KidTabs kids={v.kids} active={active} setActive={set("active")} onAdd={addKid} onRemove={removeKid} canRemove={!PLAN} />;

  return (
    <div className="min-h-full px-4 py-10 md:py-16" style={{ background: "var(--bg)" }}>
      {exporting ? (
        <div style={{ maxWidth: "900px", margin: "0 auto" }}>
          <div className="fade-in" style={{ display: "flex", justifyContent: "center", marginBottom: "16px" }}>
            <span className="btn-accent" style={{ cursor: "default" }}>Generujem PDF…</span>
          </div>
          <PrintDocument printRef={printRef} clientName={clientName.trim()} calcs={calcs} motivation={motivation} includeIntro={introInPdf} />
        </div>
      ) : (
        <div className="mx-auto w-full flex flex-col gap-8" style={{ maxWidth: "1024px" }}>
          {showIntro && (
            <section className="flex flex-col gap-4 fade-in" aria-label="Úvod pre klienta">
              <div className="card p-4 flex flex-col gap-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <span className="text-xs font-bold uppercase tracking-widest" style={{ color: "var(--accent)" }}>Úvod pre klienta</span>
                  <button type="button" className="text-xs font-semibold underline" style={{ color: "var(--text-secondary)" }} onClick={() => setShowIntro(false)}>Skryť úvod</button>
                </div>
                {tabs}
                <KidNameField kid={v.kids[active]} setKid={setKid} inPlan={!!PLAN} id="kid-name-intro" />
                <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                  <Field label="Vek dieťaťa" unit="rokov" value={v.kids[active].age} onChange={(x) => setKid({ age: x })} min={0} max={20} step={1} />
                  <Field label="Sporiť do veku" unit="rokov" value={v.kids[active].targetAge} onChange={(x) => setKid({ targetAge: x })} min={10} max={30} step={1} />
                  <Field label="Mesačný vklad" unit="EUR / mes." value={v.kids[active].monthly} onChange={(x) => setKid({ monthly: x })} min={0} max={500} step={5} />
                  <Field label="Cieľová suma" unit="EUR, dnešné ceny" value={v.kids[active].target} onChange={(x) => setKid({ target: x })} min={0} max={100000} step={500} />
                </div>
              </div>
              <KidMotivationPages m={motivation} />
              <div className="flex justify-center">
                <a href="#kalkulacia" className="btn-accent" style={{ fontSize: "1rem", padding: "0.8rem 1.6rem", textDecoration: "none", whiteSpace: "normal", textAlign: "center" }}>Poďme to prepočítať presne ↓</a>
              </div>
            </section>
          )}

          <header id="kalkulacia" className="flex flex-col gap-4" style={{ scrollMarginTop: "16px" }}>
            <div className="flex flex-col gap-2">
              <span className="text-xs font-bold uppercase tracking-widest" style={{ color: "var(--accent)" }}>Kalkulačka</span>
              <h1 className="text-3xl md:text-4xl font-extrabold" style={{ color: "var(--text-primary)", textWrap: "balance" }}>Sporenie pre deti</h1>
              <p className="text-sm md:text-base max-w-2xl" style={{ color: "var(--text-secondary)" }}>
                Koľko bude mať dieťa na účte, keď sa postaví na vlastné nohy? Kalkulačka porovná sporenie bez zhodnotenia s tromi investičnými stratégiami, ukáže, koľko treba odkladať na konkrétny cieľ, a čo stojí každý rok čakania.
              </p>
            </div>
            <div className="flex flex-wrap items-end justify-between gap-3 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
              <div className="flex flex-col gap-2 w-full max-w-md">
                <label htmlFor="client-name" className="text-sm font-semibold">Meno klienta (rodiča)</label>
                <input id="client-name" type="text" className="w-full rounded-lg px-3 py-2 text-base font-semibold"
                  placeholder="nepovinné, zobrazí sa v PDF" maxLength={80}
                  value={clientName} onChange={(e) => setClientName(e.target.value)} />
              </div>
              <div className="flex flex-wrap items-center gap-4">
                {!showIntro && (
                  <button type="button" className="text-sm font-semibold underline" style={{ color: "var(--accent)" }} onClick={() => { setShowIntro(true); window.scrollTo({ top: 0, behavior: "smooth" }); }}>
                    Zobraziť úvod pre klienta
                  </button>
                )}
                <label className="flex items-center gap-2 text-sm font-semibold" style={{ color: "var(--text-secondary)" }}>
                  <input type="checkbox" checked={introInPdf} onChange={(e) => setIntroInPdf(e.target.checked)} />
                  Úvod pre klienta v PDF
                </label>
                <button className="btn-accent" onClick={() => setExporting(true)} disabled={exporting}>Exportovať do PDF</button>
              </div>
            </div>
            {tabs}
          </header>

          <div className="grid md:grid-cols-2 gap-6 items-start">
            <InputsCard kid={v.kids[active]} setKid={setKid} v={v} set={set} inPlan={!!PLAN} />
            <div className="md:sticky md:top-4 flex flex-col gap-6 min-w-0">
              <ResultsCard c={c} />
            </div>
          </div>

          <ChartCard c={c} colors={colors} />
          <DelayCard c={c} />

          <footer className="text-xs" style={{ color: "var(--text-muted)" }}>
            Hodnota sa počíta mesačne: vklad na začiatku mesiaca, ročný výnos ÷ 12 ako mesačná sadzba (výnos je očakávané zhodnotenie po nákladoch). Ponožka = rovnaké vklady bez zhodnotenia.
            Cieľová suma je v dnešných cenách a prepočíta sa infláciou na sumu v cieľovom veku; potrebný mesačný vklad počíta so súčasným jednorazovým vkladom.
            Cena čakania = rozdiel hodnoty pri začiatku dnes a o 3 roky neskôr pri rovnakom mesačnom vklade, delený počtom rokov. Hodnota investície môže kolísať, minulé výnosy nie sú zárukou budúcich.
            Ilustratívny prepočet, nie je investičné odporúčanie.
          </footer>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
