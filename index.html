<style>
  :root {
    --bg: #f5f7f5;
    --surface: #ffffff;
    --chart-surface: #fcfcfb;
    --text-primary: #10231f;
    --text-secondary: #4b5b57;
    --text-muted: #7c8b86;
    --accent: #0f6b5c;
    --accent-soft: #e3f1ec;
    --border: rgba(16,35,31,0.10);
    --border-strong: rgba(16,35,31,0.16);
    --danger: #c23b32;

    --slot-principal: #2a78d6;
    --slot-cost: #c23b32;
    --slot-profit: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1211;
      --surface: #141c1a;
      --chart-surface: #1a1a19;
      --text-primary: #f5f7f6;
      --text-secondary: #a9b6b2;
      --text-muted: #7f8d89;
      --accent: #35b79f;
      --accent-soft: rgba(53,183,159,0.16);
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.16);
      --danger: #e2635f;

      --slot-principal: #3987e5;
      --slot-cost: #e2635f;
      --slot-profit: #199e70;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1211;
    --surface: #141c1a;
    --chart-surface: #1a1a19;
    --text-primary: #f5f7f6;
    --text-secondary: #a9b6b2;
    --text-muted: #7f8d89;
    --accent: #35b79f;
    --accent-soft: rgba(53,183,159,0.16);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.16);
    --danger: #e2635f;

    --slot-principal: #3987e5;
    --slot-cost: #e2635f;
    --slot-profit: #199e70;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .font-mono-num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  input[type="number"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border-strong);
  }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .chart-path { stroke: var(--chart-surface); stroke-width: 2; cursor: pointer; transition: opacity .15s ease, transform .15s ease; transform-origin: 110px 110px; }
  .chart-path:hover { opacity: 0.85; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .legend-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
  .legend-line.dashed { background-image: linear-gradient(to right, currentColor 60%, transparent 0%); background-size: 6px 2px; background-repeat: repeat-x; background-color: transparent !important; }
  .growth-chart-svg { touch-action: pan-y; }
  .btn-accent {
    background: var(--accent);
    color: #ffffff;
    border-radius: 10px;
    padding: 0.55rem 1.1rem;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: opacity .15s ease;
    white-space: nowrap;
  }
  .btn-accent:hover { opacity: 0.9; }
  .btn-accent:disabled { opacity: 0.55; cursor: default; }
  .fade-in { animation: calcFadeIn .32s ease; }
  @keyframes calcFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
  }
  ::selection { background: var(--accent-soft); }
</style>

const fmtEUR = (n) => new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const fmtEURprecise = (n) => new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(n);
const fmtPct = (n) => new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 1 }).format(n) + " %";
const fmtYears = (n) => (n === 1 ? "po 1 roku" : `po ${n} rokoch`);
const fmtCompactEUR = (n) => {
  if (Math.abs(n) >= 1000000) {
    return new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 2 }).format(n / 1000000) + " mil. €";
  }
  if (Math.abs(n) >= 1000) {
    return new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 1 }).format(n / 1000) + " tis. €";
  }
  return fmtEUR(n);
};
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const clampNum = (v, lo, hi) => Math.min(hi, Math.max(lo, isFinite(v) ? v : 0));

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function arcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const startOuter = polarToCartesian(cx, cy, rOuter, endAngle);
  const endOuter = polarToCartesian(cx, cy, rOuter, startAngle);
  const startInner = polarToCartesian(cx, cy, rInner, endAngle);
  const endInner = polarToCartesian(cx, cy, rInner, startAngle);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;
  return [
    "M", startOuter.x, startOuter.y,
    "A", rOuter, rOuter, 0, largeArc, 0, endOuter.x, endOuter.y,
    "L", endInner.x, endInner.y,
    "A", rInner, rInner, 0, largeArc, 1, startInner.x, startInner.y,
    "Z",
  ].join(" ");
}

function DonutChart({ slices, total, years }) {
  const [hover, setHover] = useState(null);
  const size = 220, cx = 110, cy = 110, rOuter = 100, rInner = 62;
  const gapDeg = 2.2;

  let cursor = 0;
  const geo = slices.map((s) => {
    const span = total > 0 ? (s.value / total) * 360 : 0;
    const start = cursor + gapDeg / 2;
    const end = cursor + span - gapDeg / 2;
    cursor += span;
    return { ...s, start: Math.min(start, end), end: Math.max(start, end), pct: total > 0 ? s.value / total : 0 };
  });

  return (
    <div className="relative flex items-center justify-center">
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} role="img" aria-label="Rozdelenie hrubej hodnoty investície">
        {geo.filter(s => s.value > 0).map((s, i) => (
          <path
            key={s.key}
            className="chart-path"
            d={arcPath(cx, cy, rOuter, rInner, s.start, s.end)}
            fill={s.color}
            style={hover === s.key ? { opacity: 0.85, transform: "scale(1.03)" } : undefined}
            onMouseEnter={() => setHover(s.key)}
            onMouseLeave={() => setHover(null)}
          >
            <title>{`${s.label}: ${fmtEUR(s.value)} (${fmtPct(s.pct * 100)})`}</title>
          </path>
        ))}
        <text x={cx} y={cy - 12} textAnchor="middle" className="font-mono-num" style={{ fill: "var(--text-muted)", fontSize: 10, letterSpacing: "0.04em" }}>
          HRUBÁ HODNOTA
        </text>
        <text x={cx} y={cy + 10} textAnchor="middle" className="font-mono-num" style={{ fill: "var(--text-primary)", fontSize: 18, fontWeight: 600 }}>
          {fmtEUR(total)}
        </text>
        <text x={cx} y={cy + 27} textAnchor="middle" className="font-mono-num" style={{ fill: "var(--text-muted)", fontSize: 10 }}>
          {fmtYears(years)}
        </text>
      </svg>
    </div>
  );
}

function niceScale(maxRaw, stepsCount) {
  const rough = Math.max(maxRaw, 1) / stepsCount;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / magnitude;
  let niceNorm;
  if (norm <= 1) niceNorm = 1;
  else if (norm <= 2) niceNorm = 2;
  else if (norm <= 2.5) niceNorm = 2.5;
  else if (norm <= 5) niceNorm = 5;
  else niceNorm = 10;
  const step = niceNorm * magnitude;
  return { step, max: step * stepsCount };
}

function pickYearTicks(years) {
  let stepY;
  if (years <= 5) stepY = 1;
  else if (years <= 10) stepY = 2;
  else if (years <= 20) stepY = 5;
  else stepY = 10;
  const ticks = [];
  for (let yy = 0; yy <= years; yy += stepY) ticks.push(yy);
  if (ticks[ticks.length - 1] !== years) ticks.push(years);
  return ticks;
}

function GrowthChart({ series, years, principalColor, valueColor }) {
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);

  const width = 640, height = 300;
  const padL = 80, padR = 12, padT = 16, padB = 28;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  const divisions = 5;
  const last = series[series.length - 1];
  const maxRaw = Math.max(last.value, last.invested, 1);
  const { step, max: maxVal } = niceScale(maxRaw * 1.04, divisions);

  const xScale = (yrs) => padL + clamp01(yrs / years) * plotW;
  const yScale = (val) => padT + plotH - clamp01(val / maxVal) * plotH;

  const pointsToPath = (pts) => pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");

  const investedPts = series.map((p) => [xScale(p.years), yScale(p.invested)]);
  const valuePts = series.map((p) => [xScale(p.years), yScale(p.value)]);

  const investedLinePath = pointsToPath(investedPts);
  const valueLinePath = pointsToPath(valuePts);
  const investedAreaPath = investedLinePath + ` L ${xScale(years).toFixed(2)},${yScale(0).toFixed(2)} L ${xScale(0).toFixed(2)},${yScale(0).toFixed(2)} Z`;
  const growthAreaPath = valueLinePath + " " + investedPts.slice().reverse().map((p) => `L ${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(" ") + " Z";

  const handleMove = (e) => {
    if (!svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const xUser = ((e.clientX - rect.left) / rect.width) * width;
    const yrs = clamp01((xUser - padL) / plotW) * years;
    const idx = Math.round(yrs * 12);
    setHoverIdx(Math.min(Math.max(idx, 0), series.length - 1));
  };

  const hoverPoint = hoverIdx != null ? series[hoverIdx] : null;
  const leftPct = hoverPoint ? Math.min(90, Math.max(10, (xScale(hoverPoint.years) / width) * 100)) : 0;
  const topPct = hoverPoint ? (yScale(hoverPoint.value) / height) * 100 : 0;

  return (
    <div className="relative w-full">
      <svg
        ref={svgRef}
        className="growth-chart-svg"
        viewBox={`0 0 ${width} ${height}`}
        width={width}
        height={height}
        style={{ width: "100%", height: "auto", display: "block" }}
        onMouseMove={handleMove}
        onMouseLeave={() => setHoverIdx(null)}
        role="img"
        aria-label="Vývoj hodnoty investície a vloženej sumy v čase"
      >
        {Array.from({ length: divisions + 1 }, (_, i) => i).map((i) => {
          const val = step * i;
          const yy = yScale(val);
          return (
            <g key={i}>
              <line x1={padL} y1={yy} x2={width - padR} y2={yy} stroke="var(--border)" strokeWidth="1" />
              <text x={padL - 10} y={yy + 3} textAnchor="end" className="font-mono-num" style={{ fontSize: 9, fill: "var(--text-muted)" }}>
                {fmtCompactEUR(val)}
              </text>
            </g>
          );
        })}
        {pickYearTicks(years).map((yy) => (
          <text key={yy} x={xScale(yy)} y={height - padB + 16} textAnchor="middle" className="font-mono-num" style={{ fontSize: 9, fill: "var(--text-muted)" }}>
            {yy}. rok
          </text>
        ))}

        <path d={investedAreaPath} fill={principalColor} fillOpacity="0.14" stroke="none" />
        <path d={growthAreaPath} fill={valueColor} fillOpacity="0.22" stroke="none" />
        <path d={investedLinePath} fill="none" stroke={principalColor} strokeWidth="2" strokeDasharray="5 4" />
        <path d={valueLinePath} fill="none" stroke={valueColor} strokeWidth="2.5" />

        {hoverPoint && (
          <g>
            <line x1={xScale(hoverPoint.years)} y1={padT} x2={xScale(hoverPoint.years)} y2={height - padB} stroke="var(--border-strong)" strokeWidth="1" />
            <circle cx={xScale(hoverPoint.years)} cy={yScale(hoverPoint.value)} r="4" fill={valueColor} stroke="var(--chart-surface)" strokeWidth="1.5" />
            <circle cx={xScale(hoverPoint.years)} cy={yScale(hoverPoint.invested)} r="4" fill={principalColor} stroke="var(--chart-surface)" strokeWidth="1.5" />
          </g>
        )}
      </svg>

      {hoverPoint && (
        <div
          className="absolute pointer-events-none rounded-lg px-3 py-2 text-xs"
          style={{
            left: `${leftPct}%`,
            top: `${topPct}%`,
            transform: `translate(${leftPct > 50 ? "-105%" : "5%"}, -110%)`,
            width: "12rem",
            background: "var(--surface)",
            border: "1px solid var(--border-strong)",
            boxShadow: "0 8px 20px rgba(0,0,0,0.16)",
          }}
        >
          <div className="font-semibold mb-1.5" style={{ color: "var(--text-primary)" }}>
            {hoverPoint.years.toFixed(1)}. rok
          </div>
          <div className="flex items-center gap-2 mb-1">
            <span className="legend-dot" style={{ background: valueColor }}></span>
            <span style={{ color: "var(--text-secondary)" }}>Portfólio</span>
            <span className="font-mono-num font-semibold ml-auto" style={{ color: "var(--text-primary)" }}>{fmtEUR(hoverPoint.value)}</span>
          </div>
          <div className="flex items-center gap-2">
            <span className="legend-dot" style={{ background: principalColor }}></span>
            <span style={{ color: "var(--text-secondary)" }}>Vložené</span>
            <span className="font-mono-num font-semibold ml-auto" style={{ color: "var(--text-primary)" }}>{fmtEUR(hoverPoint.invested)}</span>
          </div>
          <div className="mt-1.5 pt-1.5" style={{ borderTop: "1px solid var(--border)", color: "var(--text-secondary)" }}>
            Zisk: <span className="font-mono-num font-semibold" style={{ color: "var(--text-primary)" }}>{fmtEUR(hoverPoint.value - hoverPoint.invested)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

// Nominálna ročná sadzba prevedená na mesačnú jednoduchým delením 12
// (trhový štandard), nie efektívnym prevodom cez 12. odmocninu.
function monthlyRateFromAnnual(pct) {
  return pct / 100 / 12;
}

// Mesačná simulácia (nie uzavretý vzorec), lebo vstupný poplatok sa uplatňuje
// len počas prvých `feeSpreadMonths` mesiacov a priamo úmerne uberá z výnosu
// toho mesiaca — vklad sa pripíše na začiatku mesiaca, potom sa pripočíta
// mesačný výnos, a ak je mesiac v období rozloženia poplatku, odpočíta sa
// pomerná časť poplatku (entryFeeTotal / feeSpreadMonths).
function simulateSeries({ principal, monthlyContribution, monthlyRateNet, monthlyRateGross, months, entryFeeTotal, feeSpreadMonths }) {
  const series = [{ m: 0, years: 0, invested: principal, value: principal, grossValue: principal }];
  const monthlyFee = feeSpreadMonths > 0 ? entryFeeTotal / feeSpreadMonths : 0;
  let balanceNet = principal;
  let balanceGross = principal;
  for (let mm = 1; mm <= months; mm++) {
    balanceNet = (balanceNet + monthlyContribution) * (1 + monthlyRateNet);
    balanceGross = (balanceGross + monthlyContribution) * (1 + monthlyRateGross);
    if (mm <= feeSpreadMonths) {
      balanceNet = Math.max(0, balanceNet - monthlyFee);
    }
    series.push({
      m: mm,
      years: mm / 12,
      invested: principal + monthlyContribution * mm,
      value: balanceNet,
      grossValue: balanceGross,
    });
  }
  return series;
}

function computeScenario({ x, m, y, p, k, z, n }) {
  const principal = clampNum(x, 0, 10000000);
  const monthlyContribution = clampNum(m, 0, 100000);
  const costPct = clampNum(y, 0, 100);
  const entryFeePct = clampNum(p, 0, 100);
  const returnPct = clampNum(z, 0, 100);
  const years = clampNum(Math.round(n), 1, 40);
  const months = years * 12;
  const feeSpreadMonths = Math.max(1, Math.min(clampNum(Math.round(k), 1, 40), months));

  const totalInvested = principal + monthlyContribution * months;
  const entryFeeTotal = totalInvested * (entryFeePct / 100);

  // Zložené úročenie s pravidelným mesačným vkladom (vklad na začiatku mesiaca).
  // Priebežné náklady sa odpočítavajú z výnosu ešte pred pripísaním úroku,
  // preto znižujú aj základ pre ďalšie obdobia ("cost drag").
  const monthlyRateNet = monthlyRateFromAnnual(returnPct - costPct);
  const monthlyRateGross = monthlyRateFromAnnual(returnPct);

  const series = simulateSeries({ principal, monthlyContribution, monthlyRateNet, monthlyRateGross, months, entryFeeTotal, feeSpreadMonths });
  const last = series[series.length - 1];
  const finalValue = last.value;
  const grossValue = last.grossValue;
  const netProfit = finalValue - totalInvested;
  const costs = grossValue - finalValue;
  const grossReturn = grossValue - totalInvested;

  return { principal, monthlyContribution, costPct, entryFeePct, feeSpreadMonths, entryFeeTotal, returnPct, years, months, grossReturn, costs, netProfit, grossValue, finalValue, totalInvested, series };
}

function isWinner(value, other, higherIsBetter) {
  if (higherIsBetter === null || value === other) return false;
  return higherIsBetter ? value > other : value < other;
}

function ComparisonPanel({ a, b, betterKey }) {
  const diff = Math.abs(a.netProfit - b.netProfit);
  const rows = [
    { label: "Konečná hodnota", a: a.finalValue, b: b.finalValue, higherIsBetter: true },
    { label: "Čistý zisk", a: a.netProfit, b: b.netProfit, higherIsBetter: true },
    { label: "Vložená suma", a: a.totalInvested, b: b.totalInvested, higherIsBetter: null },
    { label: "Náklady spolu", a: a.costs, b: b.costs, higherIsBetter: false },
    { label: "z toho vstupný poplatok", a: a.entryFeeTotal, b: b.entryFeeTotal, higherIsBetter: false },
  ];

  return (
    <section className="card p-6 flex flex-col gap-4 fade-in">
      <h2 className="text-sm font-bold uppercase tracking-wide" style={{ color: "var(--text-muted)" }}>Porovnanie ponúk</h2>

      <div className="grid gap-x-3 gap-y-2" style={{ gridTemplateColumns: "minmax(0,1.3fr) 1fr 1fr" }}>
        <div></div>
        <div className="text-xs font-bold uppercase tracking-wide text-center truncate" style={{ color: betterKey === "A" ? "var(--accent)" : "var(--text-muted)" }}>Ponuka A</div>
        <div className="text-xs font-bold uppercase tracking-wide text-center truncate" style={{ color: betterKey === "B" ? "var(--accent)" : "var(--text-muted)" }}>Ponuka B</div>

        {rows.map((r) => {
          const aWins = isWinner(r.a, r.b, r.higherIsBetter);
          const bWins = isWinner(r.b, r.a, r.higherIsBetter);
          return (
            <React.Fragment key={r.label}>
              <div className="text-sm self-center truncate" style={{ color: "var(--text-secondary)" }}>{r.label}</div>
              <div className="font-mono-num text-sm font-semibold text-center" style={{ color: aWins ? "var(--accent)" : "var(--text-primary)" }}>{fmtEUR(r.a)}</div>
              <div className="font-mono-num text-sm font-semibold text-center" style={{ color: bWins ? "var(--accent)" : "var(--text-primary)" }}>{fmtEUR(r.b)}</div>
            </React.Fragment>
          );
        })}
      </div>

      {betterKey && (
        <div className="rounded-lg px-4 py-3 text-sm" style={{ background: "var(--accent-soft)", color: "var(--text-primary)", border: "1px solid var(--border)" }}>
          Výhodnejšia je <strong>Ponuka {betterKey}</strong> — vyšší čistý zisk o <span className="font-mono-num font-semibold">{fmtEUR(diff)}</span>.
        </div>
      )}
    </section>
  );
}

          "--text-muted": "#7c8b86",
          "--accent": "#0f6b5c",
          "--accent-soft": "#e3f1ec",
          "--border": "rgba(16,35,31,0.10)",
          "--border-strong": "rgba(16,35,31,0.16)",
          "--danger": "#c23b32",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "2px solid #0f6b5c", paddingBottom: "16px", marginBottom: "22px" }}>
          <div>
            <img src={LOGO_DATA_URI} alt="FinCoach" style={{ height: "34px", width: "auto", display: "block" }} />
          </div>
          <div style={{ textAlign: "right", fontSize: "11px", color: "#7c8b86" }}>
            <div>Prehľad investície</div>
            <div>Vygenerované: {dateStr}</div>
          </div>
        </div>

        <h1 style={{ fontSize: "20px", fontWeight: 800, margin: "0 0 4px", color: "#10231f" }}>Náklady vs. výnos investície</h1>
        <p style={{ fontSize: "11px", color: "#4b5b57", margin: "0 0 20px", maxWidth: "620px" }}>
          Ilustratívny prepočet zloženého úročenia s pravidelným mesačným vkladom, priebežnými nákladmi a jednorazovým poplatkom. Nie je investičné odporúčanie.
        </p>

        <PrintScenarioBlock label={compareEnabled ? "Ponuka A" : "Prehľad investície"} calc={calcA} />
        {compareEnabled && <PrintScenarioBlock label="Ponuka B" calc={calcB} />}

        {compareEnabled && (
          <div className="pdf-avoid-break" style={{ marginBottom: "20px", breakInside: "avoid" }}>
            <h2 style={{ fontSize: "16px", fontWeight: 800, margin: "0 0 10px", color: "#10231f" }}>Porovnanie ponúk</h2>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "11px" }}>
              <thead>
                <tr>
                  <th style={{ textAlign: "left", padding: "6px 8px", borderBottom: "1px solid #e4e4e0" }}></th>
                  <th style={{ textAlign: "right", padding: "6px 8px", borderBottom: "1px solid #e4e4e0", color: "#7c8b86" }}>Ponuka A</th>
                  <th style={{ textAlign: "right", padding: "6px 8px", borderBottom: "1px solid #e4e4e0", color: "#7c8b86" }}>Ponuka B</th>
                </tr>
              </thead>
              <tbody>
                {[
                  ["Konečná hodnota", calcA.finalValue, calcB.finalValue],
                  ["Čistý zisk", calcA.netProfit, calcB.netProfit],
                  ["Vložená suma", calcA.totalInvested, calcB.totalInvested],
                  ["Náklady spolu", calcA.costs, calcB.costs],
                ].map(([label, va, vb]) => (
                  <tr key={label}>
                    <td style={{ padding: "6px 8px", borderBottom: "1px solid #eee", color: "#4b5b57" }}>{label}</td>
                    <td style={{ padding: "6px 8px", borderBottom: "1px solid #eee", textAlign: "right", fontWeight: 700, color: "#10231f" }}>{fmtEUR(va)}</td>
                    <td style={{ padding: "6px 8px", borderBottom: "1px solid #eee", textAlign: "right", fontWeight: 700, color: "#10231f" }}>{fmtEUR(vb)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {betterKey && (
              <p style={{ marginTop: "10px", fontSize: "12px", color: "#10231f" }}>
                Výhodnejšia je <strong>Ponuka {betterKey}</strong> — vyšší čistý zisk o {fmtEUR(Math.abs(calcA.netProfit - calcB.netProfit))}.
              </p>
            )}
          </div>
        )}

        <div style={{ marginTop: "8px", paddingTop: "14px", borderTop: "1px solid #e4e4e0", fontSize: "9px", color: "#7c8b86", display: "flex", justifyContent: "space-between", gap: "12px" }}>
          <span>FinCoach · roman.capak@fincoach.sk · +421 910 252 036</span>
          <span>Automaticky vygenerovaný prehľad, slúži len na ilustráciu.</span>
        </div>
    </div>
  );
}

function App() {
  const [x, setX] = useState(10000);
  const [m, setM] = useState(150);
  const [y, setY] = useState(1.5);
  const [p, setP] = useState(3);
  const [k, setK] = useState(24);
  const [z, setZ] = useState(6.5);
  const [n, setN] = useState(10);

  const [compareEnabled, setCompareEnabled] = useState(false);
  const [x2, setX2] = useState(10000);
  const [m2, setM2] = useState(150);
  const [y2, setY2] = useState(1.5);
  const [p2, setP2] = useState(1);
  const [k2, setK2] = useState(12);
  const [z2, setZ2] = useState(5);
  const [n2, setN2] = useState(10);

  const [exporting, setExporting] = useState(false);
  const printRef = useRef(null);

  const calcA = useMemo(() => computeScenario({ x, m, y, p, k, z, n }), [x, m, y, p, k, z, n]);
  const calcB = useMemo(() => computeScenario({ x: x2, m: m2, y: y2, p: p2, k: k2, z: z2, n: n2 }), [x2, m2, y2, p2, k2, z2, n2]);

  const getComputedStyleColor = (varName) => {
    if (typeof window === "undefined") return "#999";
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#999";
  };
  const colors = {
    principal: getComputedStyleColor("--slot-principal"),
    cost: getComputedStyleColor("--slot-cost"),
    profit: getComputedStyleColor("--slot-profit"),
  };

  const isLossA = calcA.netProfit < 0;
  const isLossB = calcB.netProfit < 0;
  const betterKey = compareEnabled && calcA.netProfit !== calcB.netProfit ? (calcA.netProfit > calcB.netProfit ? "A" : "B") : null;

  const valuesA = { x, m, y, p, k, z, n };
  const settersA = { setX, setM, setY, setP, setK, setZ, setN };
  const valuesB = { x: x2, m: m2, y: y2, p: p2, k: k2, z: z2, n: n2 };
  const settersB = { setX: setX2, setM: setM2, setY: setY2, setP: setP2, setK: setK2, setZ: setZ2, setN: setN2 };

  // html2canvas v tomto prostredí vie spoľahlivo zachytiť len prvky, ktoré sú
  // skutočne v normálnom toku dokumentu (nie position:absolute/fixed ani vo
  // vnútri 0×0 orezaného kontajnera). Preto sa exportovaný dokument na chvíľu
  // vykreslí priamo na stránke namiesto kalkulačky a hneď po zachytení sa
  // stránka vráti do pôvodného stavu.
  useEffect(() => {
    if (!exporting) return;
    let cancelled = false;
    (async () => {
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (cancelled) return;
      const el = printRef.current;
      if (!window.html2pdf || !el) {
        setExporting(false);
        return;
      }
      try {
        const dateSlug = new Date().toISOString().slice(0, 10);
        const filename = `investicna-kalkulacka-${dateSlug}.pdf`;
        const blob = await window.html2pdf().set({
          margin: [10, 10, 14, 10],
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["css", "legacy"], avoid: [".pdf-avoid-break"] },
        }).from(el).outputPdf("blob");
        if (cancelled) return;

        // V publikovanom Artefakte blokuje sandbox priamy prehliadačový download
        // spustený stránkou — súbor treba ponúknuť cez capability "downloads".
        // Mimo Artefaktu (napr. lokálne otvorený súbor) window.claude neexistuje,
        // tam funguje bežný prehliadačový download.
        if (typeof window.claude !== "undefined" && window.claude && window.claude.use) {
          const downloadsApi = await window.claude.use("downloads");
          if (downloadsApi) {
            await downloadsApi.save({ filename, data: blob }).catch(() => {});
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      } finally {
        if (!cancelled) setExporting(false);
      }
    })();
    return () => { cancelled = true; };
  }, [exporting]);

  return (
    <div className="min-h-full px-4 py-10 md:py-16" style={{ background: "var(--bg)" }}>
      {exporting ? (
        <div style={{ maxWidth: "900px", margin: "0 auto" }}>
          <div className="fade-in" style={{ display: "flex", justifyContent: "center", marginBottom: "16px" }}>
            <span className="btn-accent" style={{ cursor: "default" }}>Generujem PDF…</span>
          </div>
          <PrintDocument printRef={printRef} compareEnabled={compareEnabled} calcA={calcA} calcB={calcB} betterKey={betterKey} />
        </div>
      ) : (
        <div
          className="mx-auto w-full flex flex-col gap-8"
          style={{ maxWidth: compareEnabled ? "1152px" : "896px", transition: "max-width .35s ease" }}
        >
          <header className="flex flex-col gap-4">
            <div className="flex flex-col gap-2">
              <span className="text-xs font-bold uppercase tracking-widest" style={{ color: "var(--accent)" }}>Kalkulačka</span>
              <h1 className="text-3xl md:text-4xl font-extrabold" style={{ color: "var(--text-primary)", textWrap: "balance" }}>
                Náklady vs. výnos investície
              </h1>
              <p className="text-sm md:text-base max-w-xl" style={{ color: "var(--text-secondary)" }}>
                Zadaj jednorazovú aj mesačnú investíciu, priebežné aj vstupný poplatok, očakávaný ročný výnos a dobu investície — kalkulačka dopočíta čistý zisk pri zloženom úročení a zobrazí vývoj aj rozdelenie hodnoty investície.
              </p>
            </div>
            <div className="flex flex-wrap items-center justify-between gap-3 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
              <label className="flex items-center gap-2 text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
                <input type="checkbox" checked={compareEnabled} onChange={(e) => setCompareEnabled(e.target.checked)} />
                Pridať investíciu na porovnanie
              </label>
              <button className="btn-accent" onClick={() => setExporting(true)} disabled={exporting}>
                Exportovať do PDF
              </button>
            </div>
          </header>

          {!compareEnabled ? (
            <>
              <div className="grid md:grid-cols-2 gap-6">
                <ScenarioInputsCard values={valuesA} setters={settersA} isLoss={isLossA} />
                <ScenarioResultsCard calc={calcA} colors={colors} />
              </div>
              <ScenarioGrowthSection calc={calcA} colors={colors} title="Vývoj investície v čase" />
            </>
          ) : (
            <>
              <div className="grid md:grid-cols-2 gap-6 fade-in">
                <ScenarioInputsCard label="Ponuka A" values={valuesA} setters={settersA} isLoss={isLossA} />
                <ScenarioInputsCard label="Ponuka B" values={valuesB} setters={settersB} isLoss={isLossB} />
              </div>
              <div className="grid md:grid-cols-2 gap-6 fade-in">
                <ScenarioResultsCard label="Ponuka A" calc={calcA} colors={colors} highlight={betterKey === "A"} />
                <ScenarioResultsCard label="Ponuka B" calc={calcB} colors={colors} highlight={betterKey === "B"} />
              </div>
              <ComparisonPanel a={calcA} b={calcB} betterKey={betterKey} />
              <div className="grid md:grid-cols-2 gap-6 fade-in">
                <ScenarioGrowthSection calc={calcA} colors={colors} title="Ponuka A — vývoj v čase" />
                <ScenarioGrowthSection calc={calcB} colors={colors} title="Ponuka B — vývoj v čase" />
              </div>
            </>
          )}

          <footer className="text-xs" style={{ color: "var(--text-muted)" }}>
            Zložené úročenie s mesačným vkladom (vklad na začiatku mesiaca, mesačná sadzba odvodená z očakávaného výnosu a ročných nákladov): hodnota sa počíta mesačne z jednorazovej investície a pravidelného mesačného vkladu. Jednorazový poplatok sa počíta z celej plánovanej investície (jednorazová investícia + mesačný vklad × počet mesiacov) a rozloží sa rovnomerne do prvých mesiacov podľa nastaveného rozloženia poplatku (max 40) — v týchto mesiacoch priamo uberá z dosiahnutého výnosu. Náklady = hrubá hodnota (bez akýchkoľvek poplatkov) − konečná hodnota; čistý zisk = konečná hodnota − vložená suma. Ilustratívny prepočet, nie je investičné odporúčanie.
          </footer>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
